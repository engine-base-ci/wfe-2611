# dagci の設定（D-128.132・D-128.135・KN-124）。GitHub の v3-gate.yml と同じ検査を、この台の容れ物の中で流す。GitHub の上では流さない（無料でずっと回す）
#   段は手で写さず scripts/ci/ci_stages.py が v3-gate.yml から導く（ci_stages.py --check が 1 対 1 を確かめる・G52・KN-124）
#   使い方は ai-team-delivery のスキルの references/ci.md。入口は <スキル>/scripts/ci/dagci/dagci
version: 1
project: kaname
workdir: /src
git:
  base: main
  history: true

include:
  - cmd: python3 scripts/ci/ci_stages.py
    from: [scripts/ci/ci_stages.py, .github/workflows/v3-gate.yml, 05_flow/build_testplan.py]

toolbox:
  from: node:22-bookworm
  # SSL_CERT_FILE：uv が入れた Python も OS の証明書を読まない（G46 が registry に聞けずに赤だった・2026-11-04）
  # NODE_EXTRA_CA_CERTS：Node は OS の証明書を読まない。会社の網・中継の内側でも npm・pnpm が通るよう、
  #   OS の証明書（Dagger のエンジンが足した証明書を含む）も読ませる
  env:
    {
      TZ: UTC,
      LANG: C.UTF-8,
      CI: "true",
      PNPM_HOME: /pnpm,
      PIP_BREAK_SYSTEM_PACKAGES: "1",
      VIRTUAL_ENV: /opt/py,
      PATH: "/opt/py/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt,
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt,
    }
  steps:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-pip git curl ca-certificates gnupg postgresql-client >/dev/null
    # docker の道具（層の棚卸しが docker compose config で infra の定義を確かめる。GitHub の実行機には最初からある）
    - install -m 0755 -d /etc/apt/keyrings && curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc &&
      echo "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list &&
      apt-get update -qq && apt-get install -y -qq --no-install-recommends docker-ce-cli docker-compose-plugin >/dev/null
    # 入れた Python を使わせるのは PATH の先頭（/opt/py/bin）で。別の場所へ links を張ると venv と見なされず、入れた部品（yaml）が見えない（G27・G37・G52 が赤だった・2026-11-04）
    # Python は GitHub の実行機（ubuntu-latest）と同じ 3.12 にそろえる（3.11 では schemathesis が AST の不具合で落ちた・2026-11-04）
    # UV_NATIVE_TLS：uv も OS の証明書を読まない（中継の内側で Python を取りに行けずに落ちた）。OS の証明書を使わせる
    - pip3 install -q uv==0.9.5 && export UV_NATIVE_TLS=1 && uv venv -q --python 3.12 /opt/py && uv pip install -q --python /opt/py/bin/python pyyaml==6.0.2 schemathesis==4.33.0 pip &&
      python3 -c 'import sys, yaml, schemathesis; assert sys.prefix == "/opt/py", sys.prefix'
    - npm install -g --silent pnpm@10.28.2
    # Google Chrome（GitHub の実行機には最初からある。Bridge のログインの確認の試験は本人の Chrome＝channel: chrome で動くので要る・G3 が赤だった・2026-11-04）
    #   Google の Linux 版 Chrome は amd64 だけ。arm64 の台（Apple シリコンの Mac）では入らず、その試験は赤になる（amd64 の台で流す。dagci にはまだ台の形を選ぶ設定が無い）
    - if [ "$(dpkg --print-architecture)" = amd64 ]; then curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb &&
      apt-get install -y -qq /tmp/chrome.deb >/dev/null && rm /tmp/chrome.deb && google-chrome --version; else echo "Chrome は $(dpkg --print-architecture) の Linux に無い"; fi

prepare:
  - name: deps
    inputs:
      [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .npmrc, "apps/*/package.json", "packages/*/package.json"]
    caches: { pnpm-store: /pnpm-store, playwright: /ms-playwright }
    run: >-
      npm_config_store_dir=/pnpm-store pnpm install --frozen-lockfile --prefer-offline &&
      PLAYWRIGHT_BROWSERS_PATH=/ms-playwright pnpm --filter @kaname/web exec playwright install --with-deps chromium

env: { PLAYWRIGHT_BROWSERS_PATH: /ms-playwright }

# GitHub と同じく job ごとに Postgres を分ける（database と spec が同じ DB を取り合わない）
#   DAGCI_SERVICE は名前を変えるためだけの値（Postgres は読まない）。Dagger は定義（image・env・ports）が同じ service を
#   1 つの実体にまとめるので、これが無いと pg-database と pg-spec が同じ Postgres になり、G3 と G27 が同じ kaname_test を
#   同時に種で入れ替えて偽の赤になった（tickets・self_only の重複キー、qa-d の FK 違反・2026-11-04）
services:
  pg-database:
    image: pgvector/pgvector:pg16
    env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: kaname_test, DAGCI_SERVICE: pg-database }
    ports: [5432]
  pg-spec:
    image: pgvector/pgvector:pg16
    env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: kaname_test, DAGCI_SERVICE: pg-spec }
    ports: [5432]

defaults: { timeout: 1800 }
red_patterns: ["FAIL", "★", "Error:", "✗"]
