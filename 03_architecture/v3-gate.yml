# .github/workflows/v3-gate.yml
# Kaname — Foundation ゲート（26本）
# 方針: ゲートが緑を維持できないなら次のスライスに進まない
name: v3-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ── 静的検査（並列・DBを要さない）──
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: "G1 lint"
        run: pnpm lint
      - name: "G2 type check"
        run: pnpm type-check

      # ── 関門の前提条件（これが破れると G16-23 が無意味になる）──
      - name: "G24 動的呼び出し禁止 [CRITICAL]"
        run: pnpm ci:no-dynamic-call

      # ── 関門の迂回検出（静的解析）──
      - name: "G16 関門C1 ネットワーク [CRITICAL]"
        run: pnpm ci:choke -- --id C1
      - name: "G17 関門C2 永続化 [CRITICAL]"
        run: pnpm ci:choke -- --id C2
      - name: "G18 関門C3 モデル呼び出し"
        run: pnpm ci:choke -- --id C3
      - name: "G19 関門C4 ファイル"
        run: pnpm ci:choke -- --id C4
      - name: "G20 関門C5 プロセス起動 [CRITICAL]"
        run: pnpm ci:choke -- --id C5
      - name: "G21 関門C6 通知"
        run: pnpm ci:choke -- --id C6
      - name: "G22 関門C7 決済 [CRITICAL]"
        run: pnpm ci:choke -- --id C7
      - name: "G23 関門C8 秘密 [CRITICAL]"
        run: pnpm ci:choke -- --id C8
      - name: "G25 関門例外台帳の整合"
        run: pnpm ci:choke-exceptions

      # ── 依存の閉じ込め ──
      - name: "G7 import 境界 [CRITICAL]"
        run: pnpm ci:boundary
      - name: "G8 Open Core ee/ 検出"
        run: pnpm ci:license-boundary
      - name: "G9 ポータビリティ台帳の整合"
        run: pnpm ci:ledger-sync

      # ── SQL 安全性 ──
      - name: "G5 auth.uid() / ベンダー固有SQL検出 [CRITICAL]"
        run: pnpm ci:no-vendor-sql
      - name: "G10 動的クエリの文字列連結禁止 [CRITICAL]"
        run: pnpm ci:no-sql-concat

      # ── 契約 ──
      - name: "G11 OpenAPI 破壊的変更検出"
        run: pnpm ci:openapi-diff
      - name: "G13 env 整合"
        run: pnpm ci:env-audit

      # ── AC ──
      - name: "G14 AC validator（4-tier / Tier4必須）"
        run: pnpm ci:ac-validate
      - name: "G26 タスクのchoke_points宣言"
        run: pnpm ci:task-choke-declared

  # ── DB を要する検査 ──
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaname_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kaname_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: "G12 実Postgresで全migration+seed適用"
        run: pnpm ci:migration-integration

      - name: "G4 RLS 全テーブル有効 [CRITICAL]"
        run: pnpm ci:rls-enabled

      - name: "G6 テナント文脈の網羅 [CRITICAL]"
        run: pnpm ci:context-set

      - name: "G3 unit test + coverage（lines 80 / branches 70）"
        run: pnpm test -- --coverage

  # ── E2E（UIを含むスライスのみ）──
  e2e:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'has-ui')
    needs: [static, database]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: "G15 E2E"
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/ }

  # ── 全ゲート緑で auto-merge ──
  auto-merge:
    runs-on: ubuntu-latest
    needs: [static, database]
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-auto-merge')
    permissions: { contents: write, pull-requests: write }
    steps:
      - name: Enable auto-merge (squash)
        run: gh pr merge --squash --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
