# G21 層の棚卸し（layer_audit.py）：全成果物に「機械の検査」か「手で見る理由」を持たせる。検査の無い層は赤。
layer_checks:
- file: 05_flow/flow.json
  check: python3 scripts/ci/flow_gate.py --mocks 06_mockup/v1 --choke 03_architecture/choke-points.json && python3 scripts/ci/trace_gate.py
- file: 03_architecture/choke-points.json
  check: python3 scripts/ci/flow_gate.py --choke 03_architecture/choke-points.json
- file: 03_architecture/ER図.md
  check: python3 scripts/ci/er_gate.py --flow 05_flow/flow.json --er 03_architecture/ER図.md
- file: 03_architecture/アーキテクチャ設計書.md
  manual: 決定の反映先に必ず「アーキテクチャ設計書」を書き、T6 で参照を検査する。節の構成（§2b 運営・§4 権限と出来事・§6b 課金/通知/エラー）が決定と対応しているかは人が読む
- file: 03_architecture/architecture.json
  manual: 設計書の機械可読の写し。設計書を更新したら同じ回で更新する（source 付きの節：permission_model / account_lifecycle / ops_console / billing / notifications / error_catalog）
- file: 03_architecture/portability-ledger.md
  manual: 境界を越えた箇所だけの台帳。実装が始まるまで空に近い
- file: 03_architecture/dependency-boundaries.json
  manual: 関心事ごとの境界。ベンダー確定（段階 1 凍結）で見直す。各境界に source
- file: 03_architecture/extension-points.json
  manual: 増えるものの見通し文書。決定でオブジェクトが増えたら source を足す（防御は関門と G20）
- file: 06_mockup/v1/v1-*.html
  check: python3 scripts/ci/mock_state_gate.py --flow 05_flow/flow.json --mocks 06_mockup/v1 && python3 scripts/ci/role_gate.py --flow 05_flow/flow.json --mocks 06_mockup/v1 && python3 scripts/ci/ui_lint.py 06_mockup/v1 --config 06_mockup/ui-lint.json && python3 scripts/ci/coverage_review.py --flow 05_flow/flow.json --mocks 06_mockup/v1 --surfaces scripts/ci/references/saas-surfaces.yaml --er 03_architecture/ER図.md --gate
- file: 06_mockup/v2/v2-*.html
  check: python3 scripts/ci/mock_state_gate.py --flow 05_flow/flow.json --mocks 06_mockup/v2 && python3 scripts/ci/role_gate.py --flow 05_flow/flow.json --mocks 06_mockup/v2 --prefix v2- --release v2 && python3 scripts/ci/ui_lint.py 06_mockup/v2 --config 06_mockup/ui-lint.json
- file: 04_design/DESIGN-kaname.md
