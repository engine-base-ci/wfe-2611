  # T7: reflect_in を狭く書いても素通りしないよう、必ず参照されるべき層を固定する
  # T8: 決定を文（決めたことの表の 1 行 = D-xxx.n）に割り、文ごとに導出物を検査する。since 以降の決定は必ず検査
  clauses:
    since: "2026-09-15"
    ids: []
    all: true            # T8 を全 confirmed 決定に（since の逃げ道を無くす・2026-09-15）
    require_table: true  # T9：決めたことの表が無い confirmed は赤
    # T10：作る・配る・版・台帳 の文はオブジェクトが要る（裏側の動きだけで反映済みにしない）
