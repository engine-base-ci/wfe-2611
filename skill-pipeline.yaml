# =============================================================================
# skill-pipeline.yaml — Kaname のスキルの連動（「これが終わればこのスキル」）
# -----------------------------------------------------------------------------
# 正本の形は ~/.claude/rules/common/skill-pipeline.yaml（Atelier の置き場で書かれている）。
# Kaname の置き場（01_hearing／02_tech_stack／05_flow／06_mockup／07_functional／08_api／09_features／07_tasks／08_schedule）に当てた写し。
# `python3 scripts/ci/pipeline-next.py` が produces の有無と done_when で「次に起動するスキル」を出す。
# 明示の done / skip は .claude/state/pipeline.json（pipeline-next.py mark で書く。理由必須）。
# =============================================================================
version: 1.0
project: Kaname
state_file: .claude/state/pipeline.json

stages:
  - id: S00
    skill: hearing
    title: ヒアリング（決定ログ・ヒアリングサマリー）
    produces: [01_hearing/決定ログ_進行中.md, 01_hearing/ヒアリングサマリー.md]
  - id: S00b
    skill: spec-sync-orchestrator
    title: 依存マップ（決定のトレーサビリティを含む）
    produces: [spec-dependencies.yaml]
    done_when: python3 scripts/ci/trace_gate.py
  - id: S01
    skill: requirements-definition
    title: 要件（要件一覧は決定ログから機械生成）
    produces: [01_hearing/要件一覧.md]
    done_when: python3 scripts/ci/trace_gate.py
  - id: S03
    skill: architecture-design
    title: アーキ設計（staging の定義・関門・境界）
    produces: [02_tech_stack/selected-stack.json, 03_architecture/choke-points.json, 03_architecture/dependency-boundaries.json, 03_architecture/foundation_gates.json]
    done_when: python3 scripts/ci/pipeline-next.py check-staging && python3 scripts/ci/layer_audit.py --run
  - id: S04
    skill: design-md
    title: デザインシステム（DESIGN.md）
    produces: [04_design/DESIGN-kaname.md]
  - id: S04b
    skill: ux-flow-design
    title: 使ってもらい方の設計（flow.json）
    produces: [05_flow/flow.json, 05_flow/使ってもらい方.md]
    requires: [spec-dependencies.yaml]
    done_when: python3 scripts/ci/flow_gate.py --choke 03_architecture/choke-points.json && python3 scripts/ci/trace_gate.py
  - id: S05
    skill: ui-mockup
    title: 画面モック（v1）
    produces: [06_mockup/v1/v1-index.html]
    requires: [05_flow/flow.json]
    done_when: python3 scripts/ci/flow_gate.py --mocks 06_mockup/v1 --choke 03_architecture/choke-points.json && bash /private/tmp/claude-501/-Users-masato0420-Downloads-----------kaname/d0b24f51-d550-4737-ae01-35f5e59bd0e1/scratchpad/mockgate.sh
  - id: S06
    skill: functional-breakdown
    title: 機能・画面・エンティティ分解（build_functional.py）
    produces: [07_functional/features.json, 07_functional/screens.json, 07_functional/entities.json, 07_functional/roles.json]
    done_when: python3 scripts/ci/fb_gate.py --flow 05_flow/flow.json --er 03_architecture/ER図.md --dir 07_functional
  - id: S07
    skill: api-design
    title: API 設計（build_api.py・契約）
    produces: [08_api/openapi.yaml, 08_api/endpoints.json]
    done_when: python3 scripts/ci/api_gate.py --flow 05_flow/flow.json --dir 08_api && node scripts/ci/contract.mjs check
  - id: S07b
    skill: spec-sync-orchestrator
    title: 仕様間の整合同期（決定を足すたび）
    produces: []
    done_when: python3 scripts/ci/pipeline-next.py check-spec-sync && python3 scripts/ci/layer_audit.py --run
    repeat: on_spec_change
  - id: S08
    skill: feature-decomposition
    title: 機能分解（build_features.py）
    produces: [09_features/features.json, 09_features/DAG.md]
    done_when: python3 scripts/ci/fd_gate.py --flow 05_flow/flow.json --dir 09_features
  - id: S09
    skill: task-decomposition
    title: タスク分解（build_tasks.py・qa_rows.l1／流れ）
    produces: [07_tasks/tickets.json, 07_qa/test-specs/journeys/plan.json]
    done_when: PYTHON=python3 bash 09_dispatch/scripts/validate.sh
  - id: S09b
    skill: ticket-planning
    title: チケット化（build_tickets.py --from-plan）
    produces: [07_tasks/tickets_plan.json, 07_tasks/board.md, 07_tasks/schedule.md, 07_tasks/assign.md]
    requires: [07_tasks/tickets.json, 07_tasks/roster.json, 08_schedule/milestones.json]
    done_when: python3 ~/.claude/skills/ticket-planning/scripts/ticket_gate.py 07_tasks/tickets_plan.json
  - id: S11
    skill: test-verification
    title: テスト戦略・CI gate
    produces: [.github/workflows/v3-gate.yml, 07_qa/test-plan/test-plan.json]
    done_when: python3 scripts/ci/tv_gate.py
  - id: S12
    skill: distributed-dev
    title: 実装パッケージ（dispatch.sh）
    produces: [09_dispatch/CLAUDE.md.template, 09_dispatch/scripts/dispatch.sh]
  - id: S13
    skill: sprint-planning
    title: Wave 編成（build_waves.py）
    produces: [08_schedule/wave-schedule.json]
    done_when: python3 scripts/ci/sp_gate.py --tickets 07_tasks/tickets.json --journeys 07_qa/test-specs/journeys/plan.json
  - id: S14
    skill: jit-task-execution
    title: タスク実装（1 チケットずつ。L1 ＋ 解禁された L2）
    repeat: per_task
    done_when: python3 scripts/ci/qa-ladder.py gate --task $TASK --spec 07_qa/test-specs --tickets 07_tasks/tickets.json
  - id: S15
    skill: e2e-journey-walkthrough
    title: 揃った流れの通し（L2）
    repeat: per_flow
    done_when: python3 scripts/ci/qa-ladder.py gate --task $TASK --spec 07_qa/test-specs --tickets 07_tasks/tickets.json
  - id: S16
    skill: human-grade-qa
    mode: diff
    title: Wave 締めの回帰（L3）
    repeat: per_wave
    done_when: python3 scripts/ci/op_gate.py --spec 07_qa/test-specs --tickets 07_tasks/tickets.json --all
  - id: S17
    skill: release-planning
    title: リリース計画（L4）
    produces: [10_release/]
    repeat: per_release

cross_cutting:
  - skill: spec-sync-orchestrator
    when: 決定ログに節を足したとき・S06〜S09 の成果物が変わったとき
