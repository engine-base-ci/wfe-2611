  unit:
    runs-on: [self-hosted, macOS]
    # 分けた単体の試験の結果を合わせ、coverage の閾値（vitest.config.ts）を合わせた結果に当てる（DB は要らない）
    needs: [static, unit-1, unit-2, unit-3, unit-4, unit-5, unit-6]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/ci_venv.sh
      - uses: actions/download-artifact@v4
        if: ${{ needs.static.outputs.unit == 'true' }}
        with: { pattern: vitest-blob-*, path: .vitest-reports, merge-multiple: true }
      - name: "G3 unit test + coverage（分けて流した結果を合わせ、閾値を当て、決めた試験が全部流れたかを見る）"
        if: ${{ !cancelled() }}
        env:
          CI_UNIT_FILES: ${{ needs.static.outputs.unit_files }}
          CI_COVERAGE_ARGS: ${{ needs.static.outputs.coverage_args }}
          CI_UNIT_SHARDS: ${{ needs.static.outputs.unit_shards }}
          CI_FULL: ${{ needs.static.outputs.full }}
        run: |
          [ -n "$CI_UNIT_SHARDS" ] || { echo "★ FAIL static の出力が空（G0 が流れていない）"; exit 1; }
          if [ "$CI_UNIT_SHARDS" = "0" ]; then echo "流す試験 0 本（チケットの CI の範囲・G0）"; exit 0; fi
          n=$(ls .vitest-reports/blob-*-"$CI_UNIT_SHARDS".json 2>/dev/null | wc -l)
          [ "$n" -eq "$CI_UNIT_SHARDS" ] || { echo "★ FAIL 分けた単体の試験の結果が $CI_UNIT_SHARDS つのうち $n つしか無い"; exit 1; }
          python3 scripts/ci/ci_scope.py run-merge && python3 scripts/ci/ci_scope.py check-count --report .vitest-reports/merged.json
  spec:
    runs-on: [self-hosted, macOS]
    # static の後に流す（act は needs の無い組を 1 段目にまとめて段ごとに流すので、needs が無いと spec が static と並び、
    #   database・unit・web が spec の終わりまで待つ・K-156）。static が赤でも飛ばさない（K-143）のは if の !cancelled() で守る。
    #   G61 が要る本線との分かれ目（base）は、この段の中で同じ scope の台本を流して自分で出す（static の G0 と同じ入力・PM の判断 2026-11-08 17:40）
    needs: [static]
    if: ${{ !cancelled() }}
    # 仕様の層の検査は Python だけでなく pnpm の検査と DB の検査も呼ぶ（層の棚卸し G21）。database と同じ Postgres を付ける
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/ci_venv.sh
      - name: DB を立てる（組の中・空いている番号・K-172）
        env: { PG_NAME: "kaname-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" }
        run: |
          docker run -d --rm --name "$PG_NAME" -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=kaname_test -p 127.0.0.1::5432 pgvector/pgvector:pg16 >/dev/null
          port=$(docker port "$PG_NAME" 5432/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 60); do docker exec "$PG_NAME" pg_isready -U postgres -q && break; sleep 1; done
          docker exec "$PG_NAME" pg_isready -U postgres -q || { echo "★ DB が 60 秒で立ち上がらない"; exit 1; }
          { echo "PG_NAME=$PG_NAME"; echo "PGPORT=$port"; echo "DATABASE_URL=postgres://postgres:postgres@localhost:$port/kaname_test"; echo "DATABASE_URL_ADMIN=postgres://postgres:postgres@localhost:$port/kaname_test"; } >> "$GITHUB_ENV"
      - name: "本線との分かれ目を出す（spec の段が自分で・static を待たない・G61 が読む・K-143）"
        id: scope
        env:
          CI_SCOPE_INPUT: ${{ inputs.scope || 'full' }}
          CI_BASE_INPUT: ${{ inputs.base }}
          CI_TICKET_INPUT: ${{ inputs.ticket }}
        run: python3 scripts/ci/ci_scope.py --base "$CI_BASE_INPUT" --head HEAD --scope "$CI_SCOPE_INPUT" --ticket "$CI_TICKET_INPUT" --github-output "$GITHUB_OUTPUT"
      - name: "チケットの Python の試験（tests: の .py を JUnit に・K-172）"
        if: ${{ !cancelled() }}
        env:
          CI_PY_TESTS: ${{ steps.scope.outputs.py_tests }}
        run: python3 scripts/ci/junit_unittest.py --out junit/spec-py.xml --files-json "$CI_PY_TESTS"
      - name: "G27 層の棚卸し（G21）"
        if: ${{ !cancelled() && (steps.scope.outputs.full == 'true' || contains(steps.scope.outputs.gates, ',27,')) }}
        env:
          CI_DB_RANGE: ${{ steps.scope.outputs.db_range }}
        run: "python3 scripts/ci/layer_audit.py --run --db-range \"${CI_DB_RANGE:-true}\""
      - name: "G28 正本 ↔ tickets の参照整合（qa-ladder validate）"
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/qa-ladder.py validate --spec 07_qa/test-specs --tickets 07_tasks/tickets.json
      - name: "G29 エラー一覧 E1〜E9（引数を省かない）"
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/error_catalog.py gate --catalog 07_qa/test-specs/errors.json --mocks 06_mockup/v1 --spec 07_qa/test-specs --choke 03_architecture/choke-points.json
      - name: "G30 スキル一式 SK1〜SK6"
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/skill_pkg_gate.py 10_skills
      - name: "G31 テスト計画の整合 TV1〜TV8"
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/tv_gate.py
      - name: "G37 デザインのトークンと新しい部品（正本どおり・明るい／暗いのコントラスト AA・生の値 D1〜D4）"
        if: ${{ !cancelled() }}
        run: python3 04_design/gen_tokens.py --web --check && python3 scripts/ci/design_gate.py --design 04_design/DESIGN-kaname.md --mocks apps/web/components/k --css apps/web/styles/k-tokens.css --part
      - name: "G38 生成物が全部最新（作り手を全部回して、中身が変わる生成物・落ちる作り手・目録に無い生成物を赤にする・D-128.123）"
        if: ${{ !cancelled() && (steps.scope.outputs.full == 'true' || contains(steps.scope.outputs.gates, ',38,')) }}
        run: python3 scripts/ci/generated_gate.py --selftest && python3 scripts/ci/generated_gate.py
      - name: "G46 使っている部品が技術の選定の記録と合う（package.json と selected-stack.json の packages を 1 対 1・D-128.123）"
        if: ${{ !cancelled() }}
        env:
          CI_BASE: ${{ steps.scope.outputs.base }}
        run: python3 scripts/ci/stack_gate.py --selftest && python3 scripts/ci/stack_gate.py --base-ref "$CI_BASE"
      - name: "G47 書いた検査が CI から回る・検査の自己試験（ci_wiring_gate・エラーの参照・自己試験・D-128.123）"
        if: ${{ !cancelled() && (steps.scope.outputs.full == 'true' || contains(steps.scope.outputs.gates, ',47,')) }}
        run: python3 scripts/ci/ci_wiring_gate.py --selftest && python3 scripts/ci/ci_wiring_gate.py && pnpm -s ci:errors-used && pnpm -s ci:errors-used:selftest && pnpm -s ci:sql-guard:selftest && pnpm -s ci:chat-one:selftest && pnpm -s ci:contract:selftest && pnpm -s ci:env-audit:selftest && python3 scripts/ci/qa_delta.py --selftest && python3 scripts/ci/static_screens_test.py && python3 scripts/ci/contract_shape_test.py && python3 scripts/ci/fuzz_targets_test.py
      - name: "G51 利用者の流れと DB の表の目録（行為はどれも 1 つの流れ・表はどれも目録に・凍結の表をコードが使わない・D-128.126・D-128.127）"
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/flow_db_gate.py --selftest && python3 scripts/ci/flow_db_gate.py
      - name: "G53 試験はどれも 1 つのチケットに属する（単体の試験・実ブラウザの試験・口ごとの権限の試験の持ち主・D-128.140）"
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_owner_gate.py --selftest && python3 scripts/ci/test_owner_gate.py
      - name: "G54 決定のトレース（決定ログの決めたことが導出物から逆引きできる・T1〜T12。手で流していたのを CI に入れた・D-128.147）"
        if: ${{ !cancelled() }}
        run: cp 01_hearing/要件一覧.md $RUNNER_TEMP/req.md && python3 scripts/ci/trace_gate.py --index && cmp $RUNNER_TEMP/req.md 01_hearing/要件一覧.md && python3 scripts/ci/trace_gate.py
      - name: "G55 No Ticket, No Commit（コミットにチケットの番号・D-128.147・K-47）"
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ticket_commit_gate.py --selftest && python3 scripts/ci/ticket_commit_gate.py
      - name: "G56 取り込む順（depends_on の実装が先に枝にある・K-94）"
        if: ${{ !cancelled() && (steps.scope.outputs.full == 'true' || contains(steps.scope.outputs.gates, ',56,')) }}
        run: python3 scripts/ci/ticket_order_gate_test.py && python3 scripts/ci/ticket_order_gate.py --selftest && python3 scripts/ci/ticket_order_gate.py
      - name: "G62 CI の無駄を止める台本の試験（範囲の表の spec・層の棚卸しの elsewhere・部品の出た日の記録・K-156）"
        if: ${{ !cancelled() && (steps.scope.outputs.full == 'true' || contains(steps.scope.outputs.gates, ',62,')) }}
        run: python3 scripts/ci/ci_lean_test.py
      - name: "G57 チケットの CI の範囲の台本の試験（K-107）"
        if: ${{ !cancelled() && (steps.scope.outputs.full == 'true' || contains(steps.scope.outputs.gates, ',57,')) }}
        run: python3 scripts/ci/ci_scope_test.py && python3 scripts/ci/ticket_affects_test.py
      - name: "G60 決める人の決定の行が、決める人への問い合わせの答えの記録と結びつく（130 番の決定から照らす・129 番までは答えの記録が無いので外す・K-103・L-014）"
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/decision_source_gate.py --selftest && python3 scripts/ci/decision_source_gate.py --log 01_hearing/決定ログ_進行中.md --answers 01_hearing/decider-answers.jsonl --label 高本さん --since D-130
      - name: "G63 決める人の答えの記録は和で移す（前の版にあった答えを落としていない・比べる版が読めない・無いなら赤・K-146）"
        if: ${{ !cancelled() }}
        env:
          CI_ANSWERS_BASE: ${{ steps.scope.outputs.base }}
          CI_TARGET_REF: ${{ inputs.target || github.event.repository.default_branch }}
        run: python3 scripts/ci/answers_merge.py --selftest && python3 scripts/ci/answers_merge.py check 01_hearing/decider-answers.jsonl --base "$CI_ANSWERS_BASE" --target "$CI_TARGET_REF"
      - name: "G64 着手前のチケットの期待結果は起きる結果で・別のチケットに回した機能はそれまでの間を書く（K13・K14・K-146・D-129.52）"
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ticket_rows_gate.py --selftest && python3 scripts/ci/ticket_process_test.py && python3 scripts/ci/ticket_rows_ci.py
      - name: "G65 CI の形の試験（自分の Mac の台・DB は組の中で・重い検査もチケットの範囲だけ・JUnit の記録・K-172）"
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/k172_ci_shape_test.py
      - name: "G61 試験の結果の欄の PASS は CI の記録から書いたものだけ（手で書いた PASS は赤・印の無い古い PASS は台帳に載った行だけ・台帳は減らすだけ・K-143・D-129.51）"
        if: ${{ !cancelled() }}
        env:
          CI_LEDGER_BASE: ${{ steps.scope.outputs.base }}
          CI_TARGET_REF: ${{ inputs.target || github.event.repository.default_branch }}
        run: python3 scripts/ci/ci_results_test.py && python3 scripts/ci/ci_results_ledger_test.py && python3 scripts/ci/ci_results.py check --specs '07_qa/test-specs/**/*.md' --records 07_qa/ci-results --ledger 07_qa/test-plan/result-ledger.json --ledger-base-ref "$CI_LEDGER_BASE" --target-ref "$CI_TARGET_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-spec, path: junit/, if-no-files-found: error, retention-days: 7 }
      - name: DB を消す（赤でも必ず）
        if: always()
        run: docker rm -f "kaname-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >/dev/null 2>&1 || true

  task-gate:
    runs-on: [self-hosted, macOS]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'task/')
    needs: [spec]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/ci_venv.sh
      - name: "ブランチ名からタスク ID を取る（task/T-A-01 → T-A-01）"
        run: echo "TASK_ID=${{ github.head_ref }}" | sed 's#task/##' >> "$GITHUB_ENV"
      - name: "G32 そのタスクの L1 行（ブランチ task/<ID>）"
