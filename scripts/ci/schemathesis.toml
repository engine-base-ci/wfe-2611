# 契約 fuzz（G36・scripts/ci/fuzz.sh）の設定。schemathesis 4.33 の既定に 413 だけを足す（K-62・テスター回 10 の #5）。
#   入口（apps/api/src/contract/op.ts）は 1 回に送る内容が 1MB を超えたら 413・PAYLOAD_TOO_LARGE で断る（D-130.1・K-144）。
#   欄の上限（例：finishBridgeJob の result 200000 字）を超える体は、字によっては 1MB も超えるので、口より先に入口が 413 で断る。
#   契約の responses にも 413 がある。断ったのに「受け付けた」（ST201）と数えないよう、断った状態コードの並びに 413 を入れる
[checks.negative_data_rejection]
expected-statuses = ["400", "401", "403", "404", "405", "406", "409", "413", "415", "422", "428", "429", "5xx"]

# K-250：はじめにやることの口の「飛ばす」は、体の key が任意の項目（credentials・表記ゆらぎを含む）のときだけ受け、
#   ほかの字（passkey・pc・知らない字・空）は 422（欄 key）で断る。契約の形は key を string としか書けない（どの字が任意の項目かは口が決める）ので、
#   この口に限って「形どおりの入力」を 422 で断るのを受け付けとして数えない（ST202 にしない）
[[operations]]
include-operation-id = "dismissSetupTasks"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "401", "403", "404", "409", "422", "429", "5xx"]

# K-161：一覧の「続きの印」（cursor）は、口が前の答えで渡した鍵の文字列（base64url）だけを受ける。形（pattern）は合っていても、
#   復号できない・3 つに分かれない印は 422（欄 cursor）で断る（D-131.9・K63-API-040）。形だけでは書けない決まりなので、
#   この口に限って「形どおりの入力」を 422 で断るのを受け付けとして数えない（ST202 にしない）
[[operations]]
include-operation-id = "listApprovalQueue"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "401", "403", "404", "409", "422", "429", "5xx"]

# K-92：チケットの一覧の「次の分の鍵」（cursor）も、口が前の答えで渡した鍵（base64url の JSON）だけを受け、復号できない印は 422（欄 cursor・K92-API-023）
[[operations]]
include-operation-id = "listTickets"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "401", "403", "404", "409", "422", "429", "5xx"]
