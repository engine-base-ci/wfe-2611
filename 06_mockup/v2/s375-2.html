<!DOCTYPE html><html><head><meta charset="utf-8"><title>st</title></head><body style="margin:0"><div style="display:flex;flex-direction:column;gap:2px;width:max-content"><iframe data-n="v2-ops-disclosure.html" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;ja&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;Kaname V2 — 運営：開示資料&lt;/title&gt;
&lt;!-- screen: ops-disclosure / acts: A86 / source: D-085.1 D-085.2 D-085.3 / shell: D-052 D-053 D-059 D-060 D-065 D-066 --&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
:root{
  --primary:#22345C; --on-primary:#FFFFFF; --primary-c:#DCE4F2; --on-primary-c:#101C33;
  --secondary:#186F69; --on-secondary:#FFFFFF; --secondary-c:#CFEAE7; --on-secondary-c:#0A3330;
  --tertiary:#6D4AA6; --on-tertiary:#FFFFFF; --tertiary-c:#E9E0F5; --on-tertiary-c:#33235C;
  --surface:#F7F8FA; --on-surface:#131B27; --sv:#E9ECF1; --on-sv:#4A5563;
  --error:#B91C1C; --on-error:#FFFFFF; --neutral:#8A94A3;
  --card:#FFFFFF; --line:#DDE2E9; --line-soft:#EDF0F4;

  --st-success:#166534; --st-warning:#B45309; --st-danger:#B91C1C; --st-progress:#1D4ED8;
  --d-indigo:#2F4B7C; --d-teal:#186F69; --d-amber:#7E570D; --d-coral:#A34A3E; --d-sage:#516F46; --d-plum:#6B3F5E;

  --s-xs:4px; --s-sm:8px; --s-md:16px; --s-lg:24px; --s-xl:48px; --s-2xl:96px;
  --r-sm:4px; --r-md:6px; --r-lg:12px; --r-xl:20px; --r-full:9999px;

  --font:&#x27;M PLUS 2&#x27;,&#x27;Hiragino Sans&#x27;,sans-serif;
  --font-code:ui-monospace,SFMono-Regular,Menlo,monospace;
  --side-bg:#EEF0F4; --side-hover:rgba(19,27,39,.06); --side-on:#FFFFFF;
  --sidebar-w:216px; --subnav-w:230px; --queue-w:380px; --queue-min:380px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg{width:16px;height:16px;flex:none}
/* ★hidden 属性は必ず効かせる。作者スタイルの display 指定に負けないように。
   （.norole{display:grid} が hidden を上書きして、隠れるはずの要素が幅を奪う事故があった） */
[hidden]{display:none!important}  /* 既定サイズ。個別指定が無くても巨大化しない */
.num{font-variant-numeric:tabular-nums}

/* ============ 操作の状態（hover / focus / active / disabled / 読み込み中）── 全部品共通。個別に書かない ============ */
:root{--dur:.15s;--ring:var(--primary)}
a[href],button,[role=tab],[role=button],.inp,input,textarea,select{transition:background-color var(--dur),color var(--dur),border-color var(--dur),box-shadow var(--dur),opacity var(--dur),transform .08s}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible,[role=tab]:focus-visible,[role=button]:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-sm)}
.inp:focus-visible{outline-offset:1px}
/* 文中のリンクは下線で「押せる」を示す。ナビ・ボタン・チップは背景で示すので下線は付けない */
a[href]:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.side a:hover,.subnav a:hover,.tabbar a:hover,a.btn:hover,a.pill:hover,a.chip:hover,.mact a:hover,.opts a:hover,.mockbar a:hover,a.card:hover{text-decoration:none}
button:not([class]):hover{background:var(--sv);color:var(--on-surface)}
button,[role=button]{min-height:24px;min-width:24px}   /* WCAG 2.2 2.5.8 */
.btn:active{transform:translateY(1px)}
.side-item:active,.sn:active,.tabbar a:active{transform:scale(.985)}
[disabled],[aria-disabled=&quot;true&quot;]{opacity:.55;cursor:not-allowed}
tbody tr:hover&gt;td{background:var(--surface)}
.skel{position:relative;overflow:hidden;background:var(--sv);border-radius:var(--r-sm);color:transparent!important;user-select:none}
.skel::after{content:&quot;&quot;;position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:sk 1.3s infinite}
@keyframes sk{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ============ モック帯（実装には含めない印） ============ */
.mockbar{position:sticky;top:0;z-index:60;background:var(--on-surface);color:#fff;font-size:11.5px;letter-spacing:.02em;padding:7px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mockbar b{font-weight:600}
.mockbar .tagv{background:var(--tertiary);padding:2px 8px;border-radius:var(--r-full);font-weight:600;font-size:10.5px}
.mockbar a{opacity:.72;border-bottom:1px solid rgba(255,255,255,.32)}
.mockbar a:hover{opacity:1}
.mockbar .sp{flex:1}
.mockbar .wsw{display:inline-flex;gap:3px;align-items:center}
.mockbar .wsw b{font-size:10.5px;opacity:.6;font-weight:600;margin-right:3px}
.mockbar .wsw button{font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--r-full);background:rgba(255,255,255,.14);color:rgba(255,255,255,.78);min-height:22px}
.mockbar .wsw button:hover{background:rgba(255,255,255,.26);color:#fff}
@media(max-width:767px){.mockbar .wsw{display:none}}

/* ============ シェル ============ */
.shell{display:flex;min-height:calc(100vh - 34px)}

/* サイドバー（D-072：中間色。紺の面はやめる。Linear / Notion と同じく本文より半段暗い灰色＋罫線 1 本） */
.side{width:var(--sidebar-w);flex:none;background:var(--side-bg);color:var(--on-surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:34px;height:calc(100vh - 34px);overflow-y:auto}
.side-brand{padding:18px 18px 14px;display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;letter-spacing:.01em;color:var(--on-surface)}
.side-brand svg{width:20px;height:20px;color:var(--primary)}
.side-nav{padding:4px 10px 10px;display:flex;flex-direction:column;gap:1px}
.side-sec{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--neutral);padding:14px 10px 5px}
.side-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-md);font-size:13.5px;font-weight:500;color:var(--on-sv);position:relative}
.side-item svg{width:16px;height:16px;opacity:.85}
.side-item:hover{background:var(--side-hover);color:var(--on-surface)}
.side-item.on{background:var(--side-on);color:var(--on-surface);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.side-item.on svg{opacity:1;color:var(--primary)}
.side-item .badge{margin-left:auto;background:var(--st-warning);color:#fff;font-size:11px;font-weight:600;padding:1px 7px;border-radius:var(--r-full)}
.side-item .badge.badge-ai{background:var(--tertiary)}
.side-sub{display:flex;flex-direction:column;gap:1px;padding-left:26px}
.side-sub a{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--r-md);font-size:12.5px;color:var(--on-sv)}
.side-sub a:hover{background:var(--side-hover);color:var(--on-surface)}
.side-sub .dot{width:4px;height:4px;border-radius:50%}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.side-foot .av{width:30px;height:30px;border-radius:var(--r-full);background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.side-foot .who{min-width:0}
.side-foot .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .co{font-size:11px;color:var(--on-sv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 本体 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);padding:14px 28px 4px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:24px;font-weight:700;letter-spacing:-.015em}
.topbar .crumb{font-size:12px;color:var(--on-sv)}
.topbar .sp{flex:1}
.content{padding:24px 32px 64px;width:100%}

/* 状態タブ */
/* 状態タブはモック専用の帯（実装には無い）。本文の帯と見分けがつくよう暗い帯にする */
.states{background:#2A3444;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.states button{padding:8px 12px;font-size:12px;font-weight:600;color:rgba(255,255,255,.7);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;flex:none}   /* flex:none が無いとタブが増えたとき縮んで文字が隣と重なる（375 幅・9 タブで発生） */
.states button:hover{color:#fff}
.states button[aria-selected=&quot;true&quot;]{color:#fff;border-bottom-color:#fff}
.states button .mk{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
.states button[aria-selected=&quot;true&quot;] .mk{background:#fff}
.statepane[hidden]{display:none!important}
.state-note{background:var(--sv);border-left:3px solid var(--neutral);border-radius:0 var(--r-md) var(--r-md) 0;padding:9px 14px;font-size:12.5px;color:var(--on-sv);margin-bottom:20px}

/* ============ 部品 ============ */
/* 箱ではなく段：罫線 1 本と余白で区切る（影より罫線・D-052。1px の箱を並べない・D-071） */
.card{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:22px 0 10px}
.card+.card{margin-top:6px}
.card:first-child{border-top:0;padding-top:4px}
.grid&gt;.card{border-top:1px solid var(--line);padding-top:18px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.card-h .sp{flex:1}
.muted{color:var(--on-sv)}
.grid{display:grid;gap:16px}
.grid&gt;*{min-width:0}   /* 既定の min-width:auto だと、中の表の min-width が列幅を押し広げる */
.card{min-width:0}
@media(min-width:768px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}}
@media(min-width:1560px){.g21{grid-template-columns:2.4fr 1fr}.g3{grid-template-columns:repeat(4,1fr)}.g3.g3-keep{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1023px){.g21{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 17px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;transition:.13s}
.btn svg{width:15px;height:15px}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:#1a2848}
.btn-s{background:var(--secondary-c);color:var(--on-secondary-c)}.btn-s:hover{background:#bfe2de}
.btn-o{border:1.5px solid var(--primary);color:var(--primary)}.btn-o:hover{background:var(--primary-c)}
.btn-g{color:var(--on-sv)}.btn-g:hover{background:var(--sv);color:var(--on-surface)}
.btn-d{border:1.5px solid var(--error);color:var(--error)}.btn-d:hover{background:#FBE9E9}
.btn-sm{padding:6px 12px;font-size:12.5px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-full);font-size:11.5px;font-weight:600;color:#fff;white-space:nowrap}
.pill svg{width:12px;height:12px}
.p-su{background:var(--st-success)}.p-wa{background:var(--st-warning)}.p-da{background:var(--st-danger)}.p-pr{background:var(--st-progress)}.p-ne{background:#6B7585}  /* 白文字で 4.6:1 */
.pill-ai{background:var(--tertiary-c);color:var(--on-tertiary-c)}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--on-sv)}
.tag .dot{width:4px;height:4px;border-radius:50%;flex:none}
td&gt;svg,th&gt;svg,p&gt;svg,span&gt;svg,b&gt;svg,a&gt;svg{vertical-align:middle;position:relative;top:-1px}
td:has(&gt;svg:only-child){text-align:center}
.card-h&gt;svg{align-self:center}
.dl{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.dl&gt;div{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border-radius:var(--r-md)}
.dl&gt;div&gt;svg{flex:none}
.rail{border-left:2px solid var(--neutral);padding-left:11px}

.metric{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.metric-sm{font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.metric-lbl{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--on-sv);margin-bottom:7px}
.metric-sub{font-size:12.5px;color:var(--on-sv);font-variant-numeric:tabular-nums;margin-top:7px}
.bar{height:6px;background:var(--sv);border-radius:var(--r-full);overflow:hidden;margin-top:11px}
.bar&gt;i{display:block;height:100%;background:var(--primary);border-radius:var(--r-full)}
.bar&gt;i.warn{background:var(--st-warning)}.bar&gt;i.ok{background:var(--st-success)}.bar&gt;i.bad{background:var(--st-danger)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--on-sv);padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.n{font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
tr:last-child td{border-bottom:0}
.t-wrap{overflow-x:auto}

.ai{background:var(--tertiary-c);color:var(--on-tertiary-c);border-left:3px solid var(--tertiary);border-radius:0 var(--r-md) var(--r-md) 0;padding:14px 16px}
.ai-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.06em;margin-bottom:7px}
.ai-h svg{width:13px;height:13px}

.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--on-sv);margin-bottom:6px}
.inp{width:100%;background:var(--sv);border:1px solid transparent;border-radius:var(--r-md);padding:10px 13px;font-family:inherit;font-size:14px;color:var(--on-surface)}
.inp:focus{outline:2px solid var(--primary);outline-offset:1px;background:var(--card)}
.inp.err{outline:2px solid var(--error);background:#FDF2F2}
.help{font-size:12px;color:var(--on-sv);margin-top:5px}
.help.err{color:var(--error);font-weight:500;display:flex;gap:6px;align-items:flex-start}
.help.err svg{width:14px;height:14px;margin-top:3px;flex:none}

.empty{text-align:center;padding:56px 20px;color:var(--on-sv)}
.empty svg{width:38px;height:38px;opacity:.34;margin-bottom:14px}
.empty h3{font-size:15px;font-weight:700;color:var(--on-surface);margin-bottom:6px}
.empty p{font-size:13px;max-width:420px;margin:0 auto 18px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px}
.kv dt{color:var(--on-sv);white-space:nowrap}
.kv dd{font-weight:500}
.code{background:var(--on-surface);color:#D8DEE9;border-radius:var(--r-md);padding:13px 15px;font-family:var(--font-code);font-size:12px;line-height:1.75;white-space:pre;overflow-x:auto}

.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(19,27,39,.2);border-top-color:var(--primary)}
@keyframes sp{to{transform:rotate(360deg)}}


/* ============ 画面ごとの第2サイドバー（画面によって中身が変わる） ============ */
.subnav{width:var(--subnav-w);flex:none;background:var(--card);border-right:1px solid var(--line);
        position:sticky;top:34px;height:calc(100vh - 34px);overflow-y:auto;display:flex;flex-direction:column}
.subnav-h{padding:16px 16px 12px;border-bottom:1px solid var(--line-soft)}
.subnav-h .ttl{font-size:14px;font-weight:700;margin-bottom:5px}
.subnav-h .why{font-size:11.5px;color:var(--on-sv);line-height:1.65}
.subnav-b{padding:10px;display:flex;flex-direction:column;gap:1px}
.subnav-sec{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--on-sv);padding:13px 8px 5px}
.sn{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-md);font-size:13px;color:var(--on-sv)}
.sn:hover{background:var(--sv);color:var(--on-surface)}
.sn.on{background:var(--primary-c);color:var(--on-primary-c);font-weight:600}
.sn .dot{width:4px;height:4px;border-radius:50%;flex:none}
.sn .n{margin-left:auto;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--on-sv)}
.sn .n.warn{color:#92400E;font-weight:700}  /* 薄い面の上でも 4.5:1 */
.subnav-f{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line-soft)}

/* 権限バー（アカウントタイプの切替＝モック用） */
.rolebar{display:flex;gap:5px;align-items:center}
.rolebar b{font-size:10.5px;opacity:.6;font-weight:600;letter-spacing:.06em}
.rolebar button{font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--r-full);
  background:rgba(255,255,255,.14);color:rgba(255,255,255,.72)}
.rolebar button[aria-pressed=&quot;true&quot;]{background:#fff;color:var(--on-surface)}
.side[data-role]{display:none}
.side[data-role].on{display:flex}
.norole{flex:1;min-width:0;display:grid;place-content:center;text-align:center;padding:40px 28px}
.norole&gt;*{max-width:560px}
.norole svg{width:34px;height:34px;color:var(--on-sv);margin:0 auto 4px}
.norole h3{font-size:16px;font-weight:700;margin:12px 0 8px}
.norole p{font-size:13px;color:var(--on-sv);line-height:1.8}

/* 画面の目的（topbar 下） */
.purpose{display:none!important;background:var(--card);border-bottom:1px solid var(--line);padding:11px 32px;
  display:flex;gap:11px;align-items:center;font-size:13px;color:var(--on-sv);line-height:1.75}
.purpose svg{color:var(--primary)}
.purpose b{color:var(--on-surface)}

/* モバイル下部タブ */
.tabbar{display:none}
@media(max-width:767px){
  .side,.side[data-role].on{display:none}   /* ★役割切替の .on（詳細度が高い）に負けないよう両方書く */
  .content{padding:18px 16px 92px}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:18px}
  .inp,input:not([type=checkbox]):not([type=radio]),textarea,select{font-size:16px!important}   /* iOS Safari はフォーカス時に 16px 未満の入力欄へ自動ズームする。部品側の指定より必ず勝つ */
  .states{padding:0 16px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--on-sv);position:relative}
  .tabbar a svg{width:19px;height:19px}
  .tabbar a.on{color:var(--primary)}
  .tabbar a .bdg{position:absolute;top:2px;right:calc(50% - 17px);background:var(--st-warning);color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;border-radius:var(--r-full);display:grid;place-items:center;padding:0 4px}
  .grid.g2,.grid.g3,.grid.g21{grid-template-columns:1fr}
  .purpose{padding:10px 16px}
  .subnav{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);flex-direction:column}
  .subnav-h{display:none}   /* スマホでは見出し・目的は本文の見出しと重複するので出さない。第2ナビは帯（チップ）だけ */

v class=&quot;now&quot;&gt;&lt;span class=&quot;d&quot;&gt;&lt;/span&gt;&lt;span&gt;承認待ち（あなた）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;a href=&quot;../v1/v1-ai-activity.html&quot; style=&quot;font-size:12px;color:var(--primary);font-weight:600&quot;&gt;動きを全部見る →&lt;/a&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;ap-c&quot;&gt;&lt;div class=&quot;slash&quot;&gt;&lt;span&gt;/配る&lt;/span&gt;&lt;span&gt;/数値&lt;/span&gt;&lt;span&gt;/覚えて&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12&quot;/&gt;&lt;/svg&gt;&lt;textarea placeholder=&quot;続けて話す&quot;&gt;&lt;/textarea&gt;&lt;button class=&quot;btn btn-p btn-sm&quot;&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z&quot;/&gt;&lt;path d=&quot;m21.854 2.147-10.94 10.939&quot;/&gt;&lt;/svg&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/aside&gt;&lt;div class=&quot;norole&quot; data-role=&quot;R1&quot; hidden&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect width=&quot;18&quot; height=&quot;11&quot; x=&quot;3&quot; y=&quot;11&quot; rx=&quot;2&quot; ry=&quot;2&quot;/&gt;&lt;path d=&quot;M7 11V7a5 5 0 0 1 10 0v4&quot;/&gt;&lt;/svg&gt;&lt;h3&gt;この画面は「自分で全部回している人」には見えません&lt;/h3&gt;&lt;p&gt;一人社長・個人事業。営業も制作も経理も自分。契約する人であり毎日使う人でもある&lt;br&gt;権限で主ナビの項目そのものが変わるため、この画面への入口がありません。&lt;/p&gt;&lt;div class=&quot;go&quot;&gt;この権限で見られるもの：今日、自分のAIと話す、AI社員の動き、自分のAIとAI社員のやりとり&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;norole&quot; data-role=&quot;R2&quot; hidden&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect width=&quot;18&quot; height=&quot;11&quot; x=&quot;3&quot; y=&quot;11&quot; rx=&quot;2&quot; ry=&quot;2&quot;/&gt;&lt;path d=&quot;M7 11V7a5 5 0 0 1 10 0v4&quot;/&gt;&lt;/svg&gt;&lt;h3&gt;この画面は「代表と、その下に数人がいる会社の代表」には見えません&lt;/h3&gt;&lt;p&gt;中小・ベンチャーの社長。自分も現場を持ちつつ社員・外注に配っている&lt;br&gt;権限で主ナビの項目そのものが変わるため、この画面への入口がありません。&lt;/p&gt;&lt;div class=&quot;go&quot;&gt;この権限で見られるもの：今日、自分のAIと話す、AI社員の動き、自分のAIとAI社員のやりとり&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;norole&quot; data-role=&quot;R3&quot; hidden&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect width=&quot;18&quot; height=&quot;11&quot; x=&quot;3&quot; y=&quot;11&quot; rx=&quot;2&quot; ry=&quot;2&quot;/&gt;&lt;path d=&quot;M7 11V7a5 5 0 0 1 10 0v4&quot;/&gt;&lt;/svg&gt;&lt;h3&gt;この画面は「配られた仕事だけをする人」には見えません&lt;/h3&gt;&lt;p&gt;社員・外注。自分の担当分だけ見る。会社全体の数字も統制も見ない・見せない&lt;br&gt;権限で主ナビの項目そのものが変わるため、この画面への入口がありません。&lt;/p&gt;&lt;div class=&quot;go&quot;&gt;この権限で見られるもの：今日、自分のAIと話す、AI社員の動き、自分のAIとAI社員のやりとり&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;norole&quot; data-role=&quot;R4&quot; hidden&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect width=&quot;18&quot; height=&quot;11&quot; x=&quot;3&quot; y=&quot;11&quot; rx=&quot;2&quot; ry=&quot;2&quot;/&gt;&lt;path d=&quot;M7 11V7a5 5 0 0 1 10 0v4&quot;/&gt;&lt;/svg&gt;&lt;h3&gt;この画面は「進捗だけ見る外部の人」には見えません&lt;/h3&gt;&lt;p&gt;業務委託先・パートナー。書き込まない。見える範囲を絞って渡す&lt;br&gt;権限で主ナビの項目そのものが変わるため、この画面への入口がありません。&lt;/p&gt;&lt;div class=&quot;go&quot;&gt;この権限で見られるもの：自分のAIと話す、自分のAIの記憶、タスク、台帳&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;tabbar&quot; data-role=&quot;R1&quot; data-requires=&quot;app&quot;&gt;&lt;a class=&quot;&quot; href=&quot;../v1/v1-today.html&quot;&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect width=&quot;18&quot; height=&quot;18&quot; x=&quot;3&quot; y=&quot;4&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M16 2v4M8 2v4M3 10h18&quot;/&gt;&lt;path d=&quot;m9 16 2 2 4-4&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;bdg&quot; data-requires=&quot;data&quot;&gt;4&lt;/span&gt;&lt;span&gt;今日&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;&quot; href=&quot;../v1/v1-clone-chat.html&quot;&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z&quot;/&gt;&lt;/svg&gt;&lt;span&gt;高本AIと話す&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;&quot; href=&quot;../v1/v1-ai-activity.html&quot;&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;circle cx=&quot;6&quot; cy=&quot;19&quot; r=&quot;3&quot;/&gt;&lt;path d=&quot;M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15&quot;/&gt;&lt;circle cx=&quot;18&quot; cy=&quot;5&quot; r=&quot;3&quot;/&gt;&lt;/svg&gt;&lt;span&gt;AI社員の動き&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;&quot; href=&quot;../v1/v1-clone-thread.html&quot;&gt;&lt;svg class=&quot;&q :root{

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}

/* ============ モック帯（実装には含めない印） ============ */

/* ============ シェル ============ */
.shell{display:flex;min-height:calc(100vh - 34px)}

.side{width:var(--sidebar-w);flex:none;background:var(--side-bg);color:var(--on-surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:34px;height:calc(100vh - 34px);overflow-y:auto}

/* 箱ではなく段：罫線 1 本と余白で区切る（影より罫線・D-052。1px の箱を並べない・D-071） */
.card{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:22px 0 10px}

.grid{display:grid;gap:16px}
.grid&gt;*{min-width:0}   /* 既定の min-width:auto だと、中の表の min-width が列幅を押し広げる */
.card{min-width:0}
@media(min-width:768px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 17px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;transition:.13s}
.btn svg{width:15px;height:15px}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:#1a2848}

td&gt;svg,th&gt;svg,p&gt;svg,span&gt;svg,b&gt;svg,a&gt;svg{vertical-align:middle;position:relative;top:-1px}
td:has(&gt;svg:only-child){text-align:center}
.card-h&gt;svg{align-self:center}

.metric{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}

.bar{height:6px;background:var(--sv);border-radius:var(--r-full);overflow:hidden;margin-top:11px}
.bar&gt;i{display:block;height:100%;background:var(--primary);border-radius:var(--r-full)}
.bar&gt;i.warn{background:var(--st-warning)}.bar&gt;i.ok{background:var(--st-success)}.bar&gt;i.bad{background:var(--st-danger)}

table{width:100%;border-collapse:collapse;font-size:13.5px}

.ai{background:var(--tertiary-c);color:var(--on-tertiary-c);border-left:3px solid var(--tertiary);border-radius:0 var(--r-md) var(--r-md) 0;padding:14px 16px}
.ai-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.06em;margin-bottom:7px}

.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--on-sv);margin-bottom:6px}

.empty{text-align:center;padding:56px 20px;color:var(--on-sv)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px}

.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}

@keyframes sp{to{transform:rotate(360deg)}}


/* ============ 画面ごとの第2サイドバー（画面によって中身が変わる） ============ */
.subnav{width:var(--subnav-w);flex:none;background:var(--card);border-right:1px solid var(--line);
        position:sticky;top:34px;height:calc(100vh - 34px);overflow-y:auto;display:flex;flex-direction:column}

.sn .n.warn{color:#92400E;font-weight:700}  /* 薄い面の上でも 4.5:1 */
.subnav-f{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line-soft)}

/* 権限バー（アカウントタイプの切替＝モック用） */
.rolebar{display:flex;gap:5px;align-items:center}
.rolebar b{font-size:10.5px;opacity:.6;font-weight:600;letter-spacing:.06em}
.rolebar button{font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--r-full);
  background:rgba(255,255,255,.14);color:rgba(255,255,255,.72)}
.rolebar button[aria-pressed=&quot;true&quot;]{background:#fff;color:var(--on-surface)}
.side[data-role]{display:none}

.norole{flex:1;min-width:0;display:grid;place-content:center;text-align:center;padding:40px 28px}
.norole&gt;*{max-width:560px}

.norole h3{font-size:16px;font-weight:700;margin:12px 0 8px}
.norole p{font-size:13px;color:var(--on-sv);line-height:1.8}

/* 画面の目的（topbar 下） */
.purpose{display:none!important;background:var(--card);border-bottom:1px solid var(--line);padding:11px 32px;
  display:flex;gap:11px;align-items:center;font-size:13px;color:var(--on-sv);line-height:1.75}
.purpose svg{color:var(--primary)}
.purpose b{color:var(--on-surface)}

/* モバイル下部タブ */
.tabbar{display:none}
@media(max-width:767px){
  .side,.side[data-role].on{display:none}   /* ★役割切替の .on（詳細度が高い）に負けないよう両方書く */
  .content{padding:18px 16px 92px}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:18px}
  .inp,input:not([type=checkbox]):not([type=radio]),textarea,select{font-size:16px!important}   /* iOS Safari はフォーカス時に 16px 未満の入力欄へ自動ズームする。部品側の指定より必ず勝つ */
  .states{padding:0 16px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--on-sv);position:relative}
  .tabbar a svg{width:19px;height:19px}
  .tabbar a.on{color:var(--primary)}
  .tabbar a .bdg{position:absolute;top:2px;right:calc(50% - 17px);background:var(--st-warning);color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;border-radius:var(--r-full);display:grid;place-items:center;padding:0 4px}
  .grid.g2,.grid.g3,.grid.g21{grid-template-columns:1fr}
  .purpose{padding:10px 16px}
  .subnav{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);flex-direction:column}
  .subnav-h{display:none}   /* スマホでは見出し・目的は本文の見出しと重複するので出さない。第2ナビは帯（チップ）だけ */
  .subnav-h .acts{display:none}   /* 行為ID・役割・根拠のチップは開発者向け。スマホでは出さない（本文が下に押し出される） */
  .subnav-h .why{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .subnav-b{flex-direction:row;overflow-x:auto;gap:6px;padding:10px 16px}
  .subnav-b .sn{white-space:nowrap;background:var(--sv);flex:none}
  .subnav-sec{display:none}
  .subnav-f{display:none}
  .shell{flex-direction:column}
  /* 表は縮めずに、表の中だけ横スクロールさせる（本文は絶対に横スクロールさせない） */
  .t-wrap{margin:0 -16px;padding:0 16px}
  .t-wrap table{min-width:560px}
  .card{padding:16px}
  .metric{font-size:30px}
}

/* ============ v2 シェル（flow.json 駆動）で足したもの ============ */
.mockbar .ph{opacity:.55;font-size:11px}
.mockbar .mut{opacity:.5}
.topbar .tt{min-width:0}
.subnav-h .acts{margin-top:9px;display:flex;gap:4px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}   /* ボタンの並び。くっつけない（全画面共通） */
.subnav-h .ck.rl{background:var(--sv);color:var(--on-sv)}
.subnav-h .ck{font-size:10px;font-weight:600;font-family:var(--font-code);background:var(--primary-c);
  color:var(--on-primary-c);padding:1px 6px;border-radius:var(--r-full)}
.norole .go{margin-top:14px;font-size:12px;color:var(--on-sv);background:var(--sv);
  border-radius:var(--r-md);padding:9px 13px;display:inline-block}
.purpose b{color:var(--on-surface)}
/* 主アクションは1つだけ。副は枠線・文字だけに落とす */
.topbar .btn-p{box-shadow:0 1px 0 rgba(0,0,0,.06)}


.side-grp{width:100%;text-align:left}
.side-grp .chev{margin-left:auto;display:flex;opacity:.55;transition:.15s}
.side-grp .chev svg{width:14px;height:14px}
.side-grp.open .chev{transform:rotate(180deg)}
.side-grp .badge{margin-left:auto}
.side-grp .badge+.chev{margin-left:6px}
.side-sub a.on{background:var(--side-on);color:var(--on-surface);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.side-sub a svg{width:13px;height:13px;opacity:.8}
.side-sub a .badge{margin-left:auto;background:var(--st-warning);color:#fff;font-size:11px;font-weight:600;padding:0 6px;border-radius:var(--r-full)}
/* レール（アイコン＋小さな名前）。タブレットと、三画面（D-072）の画面で使う。1 か所に書き、接頭辞だけ変える */
@media(min-width:1180px){
.shell[data-layout=threepane]{--sidebar-w:72px}
.shell[data-layout=threepane] .side{width:72px}
.shell[data-layout=threepane] .side-brand{justify-content:center;padding:16px 0 10px}
.shell[data-layout=threepane] .side-brand span{display:none}
.shell[data-layout=threepane] .side-nav{padding:4px 6px}
.shell[data-layout=threepane] .side-item{flex-direction:column;gap:4px;padding:9px 2px;font-size:11px;line-height:1.2;text-align:center;border-radius:var(--r-md)}
.shell[data-layout=threepane] .side-item svg{width:20px;height:20px}
.shell[data-layout=threepane] .side-item .badge{position:absolute;top:4px;right:6px;margin:0}
.shell[data-layout=threepane] .side-grp .chev{display:none}
.shell[data-layout=threepane] .side-sub{position:fixed;left:72px;top:34px;bottom:0;width:216px;background:var(--side-bg);border-right:1px solid var(--line);padding:14px 10px;z-index:57;box-shadow:8px 0 24px rgba(0,0,0,.12);gap:2px}
.shell[data-layout=threepane] .side-sub a{font-size:13px;padding:8px 10px}
.shell[data-layout=threepane] .side-foot{padding:10px 6px;justify-content:center}
.shell[data-layout=threepane] .side-foot .who{display:none}
}
.sn{flex-direction:column;align-items:flex-start;gap:2px}
.sn .sn-l{display:flex;align-items:center;gap:8px;width:100%}
.sn .sn-l .n{margin-left:auto}
.sn .sn-d{font-size:11px;color:var(--on-sv);line-height:1.5;font-weight:400}
.sn.on .sn-d{color:var(--on-primary-c);opacity:.8}
@media(max-width:767px){.sn .sn-d{display:none}}
.aipanel{width:340px;flex:none;background:var(--card);border-left:1px solid var(--line);position:sticky;top:34px;height:calc(100vh - 34px);display:none;flex-direction:column}
.shell.panel-open .aipanel.on{display:flex}
.ap-h{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.ap-h .av{width:32px;height:32px;border-radius:var(--r-full);background:var(--tertiary-c);color:var(--on-tertiary-c);display:grid;place-items:center;flex:none}
.ap-h .nm{font-size:13.5px;font-weight:700}.ap-h .ctx{font-size:11.5px;color:var(--on-sv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-h .btn-sm{padding:5px 7px}
.ap-b{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.pm{max-width:92%;padding:9px 12px;border-radius:var(--r-lg);font-size:13px;line-height:1.75}
.pm.u{align-self:flex-end;background:var(--primary-c);color:var(--on-primary-c)}
.pm.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.pm .pm-when{display:block;font-size:11.5px;color:var(--tertiary);font-weight:600;margin-bottom:3px}
.pm .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ptree{border:1px solid var(--line);border-radius:var(--r-md);padding:8px 11px;font-size:12.5px}
.ptree summary{cursor:pointer;font-weight:600;color:var(--on-sv);font-size:12px}
.ptree .tl{margin-top:8px}
.ptree .tl&gt;div{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12px}
.ptree .tl .d{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none;background:var(--neutral)}
.ptree .tl .done .d{background:var(--st-success)}.ptree .tl .now .d{background:var(--st-progress)}
.ap-c{border-top:1px solid var(--line-soft);padding:10px 12px}
.ap-c .slash{display:flex;gap:6px;margin-bottom:7px}.ap-c .slash span{font-size:11px;background:var(--sv);padding:2px 8px;border-radius:var(--r-full);color:var(--on-sv)}
.ap-c .box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 10px}
.ap-c .box svg{margin-bottom:6px;color:var(--on-sv)}
.ap-c textarea{flex:1;border:0;background:none;font:inherit;font-size:13px;resize:none;min-height:24px}
.ap-c textarea:focus-visible{outline:none}
.ap-c:focus-within{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-md)}
.ap-toggle[aria-pressed=&quot;true&quot;]{background:var(--primary-c)}
.ai-stopped{color:var(--st-warning);font-weight:600}
/* はじめの設定の枠（運用前）：サイドバー・第2ナビ・下タブは data-requires=app で隠れる。格子も1列に */
.shell[data-frame=&quot;wizard&quot;]{display:block!important}
.shell[data-frame=&quot;wizard&quot;] .main{width:100%}
.subnav-h .crumb{font-size:12px;color:var(--on-sv);margin-bottom:2px}
.subnav-h{padding:14px 16px 12px}
.subnav-h .ttl{font-size:14px;line-height:1.5}
[data-ps-only]{display:none}
.ai-fab{display:none}
/* ============ 本文の最小幅（D-070）：本文が 720px を下回るなら第2ナビを上の帯に畳む。入口画面（anchors）は常に上の帯 ============ */
@media(min-width:1180px){
  .shell.sub-chips{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  .shell.sub-chips .side{grid-column:1;grid-row:1/3}
  .shell.sub-chips .subnav{grid-column:2;grid-row:1;width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);flex-direction:column}
  .shell.sub-chips .subnav-h{padding:12px 28px 4px}.shell.sub-chips .subnav-h .why{display:none}.shell.sub-chips .subnav-h .crumb{display:none}.shell.sub-chips .subnav-h .ttl{display:none}
  .shell.sub-chips .subnav-b{flex-direction:row;overflow-x:auto;gap:6px;padding:8px 28px 12px}
  .shell.sub-chips .subnav-b .sn{white-space:nowrap;background:var(--sv);flex:none;flex-direction:row;padding:6px 12px}
  .shell.sub-chips .subnav-sec{display:none}.shell.sub-chips .sn .sn-d{display:none}
  .shell.sub-chips .main{grid-column:2;grid-row:2}
  .shell.sub-chips .aipanel{grid-column:3;grid-row:1/3}
  .shell.sub-chips .norole{grid-column:2;grid-row:1/3}
  .shell.sub-chips .blocked{grid-column:2;grid-row:1/3}
}
@media(max-width:767px){
  .aipanel{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:72vh;z-index:58;border-left:0;border-top:1px solid var(--line);border-radius:var(--r-xl) var(--r-xl) 0 0}
  .ap-toggle .ap-name{display:none}
  .shell.panel-open .subnav{display:block}
}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:12px;color:var(--on-sv)}
.sec-h b{font-size:15px;color:var(--on-surface)}
.src-foot{font-size:11px;color:var(--on-sv);padding:14px 32px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.src-foot .ck{font-size:11px;font-weight:600;font-family:var(--font-code);background:#F4EFDA;color:#5C4A0E;padding:1px 6px;border-radius:var(--r-full)}
@media(max-width:767px){.src-foot{padding:12px 16px 0}}

/* ============ 上を詰める（D-072）：状態タブはモック帯の中へ、三画面の画面では見出し行を消して主ボタンを第2ナビの行に ============ */
.mockbar .states{background:none;padding:0;margin-left:6px;gap:0;overflow-x:auto;max-width:46vw}
.mockbar .states button{padding:3px 8px;font-size:11px;color:rgba(255,255,255,.6);border-bottom:0;border-radius:var(--r-full);gap:5px}
.mockbar .states button[aria-selected=&quot;true&quot;]{color:#fff;background:rgba(255,255,255,.16)}
.mockbar .states button .mk{display:none}
.shell[data-layout=threepane] .topbar{display:none}
.shell[data-layout=threepane] .subnav-h{display:none}
.shell[data-layout=threepane] .subnav-b{align-items:center;padding:8px 24px}
.shell[data-layout=threepane] .subnav-b .sn{flex:none}
.shell[data-layout=threepane] .subnav-b .sn-acts{margin-left:auto;display:flex;gap:8px;flex:none;align-items:center}
@media(max-width:1023px){
  .shell[data-layout=threepane] .subnav-b{flex-wrap:wrap;overflow:visible;padding:8px 16px}
  .shell[data-layout=threepane] .subnav-b .sn-acts{flex-basis:100%;justify-content:flex-end;margin-left:0}
}
@media(max-width:767px){.mockbar .states{max-width:100%;flex-basis:100%;order:9}}

/* タブレットは基本規則より後に置く（同じ詳細度では後勝ち） */
/* ============ タブレット 768〜1179（D-064）：レール＋横チップの第2ナビ＋重なるパネル ============ */
@media(min-width:768px) and (max-width:1179px){
  .shell{display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-height:calc(100vh - 34px)}
  .side{grid-column:1;grid-row:1/3}
.side{width:72px}
.side-brand{justify-content:center;padding:16px 0 10px}
.side-brand span{display:none}
.side-nav{padding:4px 6px}
.side-item{flex-direction:column;gap:4px;padding:9px 2px;font-size:11px;line-height:1.2;text-align:center;border-radius:var(--r-md)}
.side-item svg{width:20px;height:20px}
.side-item .badge{position:absolute;top:4px;right:6px;margin:0}
.side-grp .chev{display:none}
.side-sub{position:fixed;left:72px;top:34px;bottom:0;width:216px;background:var(--side-bg);border-right:1px solid var(--line);padding:14px 10px;z-index:57;box-shadow:8px 0 24px rgba(0,0,0,.12);gap:2px}
.side-sub a{font-size:13px;padding:8px 10px}
.side-foot{padding:10px 6px;justify-content:center}
.side-foot .who{display:none}
  .subnav{grid-column:2;grid-row:1;width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);flex-direction:column}
  .subnav-h{padding:12px 20px 6px}.subnav-h .why{display:none}.subnav-h .crumb{display:none}
  .subnav-b{flex-direction:row;overflow-x:auto;gap:6px;padding:8px 20px 12px}
  .subnav-b .sn{white-space:nowrap;background:var(--sv);flex:none;flex-direction:row;padding:6px 12px}
  .subnav-sec{display:none}.sn .sn-d{display:none}
  .main{grid-column:2;grid-row:2}
  .norole{grid-column:2;grid-row:1/3}
  .content{padding:20px 24px 64px}
  .topbar{padding:12px 20px 4px}.purpose{padding:10px 20px}
  .aipanel{position:fixed;right:0;top:34px;bottom:0;width:360px;height:auto;z-index:58;box-shadow:-8px 0 24px rgba(0,0,0,.12);border-radius:0}
  .ap-toggle .ap-name{display:none}
}

.ost{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px;margin-bottom:14px}
.ost&gt;div{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:10px 12px;border-left:4px solid var(--hc)}
.ost b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}.ost small{color:var(--on-sv);font-size:11.5px}
.plan{display:inline-flex;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-full)}
.plan.e{background:var(--sv);color:var(--on-sv)}.plan.s{background:#DBEAFE;color:#1E3A8A}.plan.p{background:#E9E0F5;color:#6D4AA6}
.dotst{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}.dotst i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--st-success)}.dotst i.wa{background:var(--st-warning)}.dotst i.da{background:var(--st-danger)}.dotst i.ne{background:var(--on-sv)}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.ci{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);padding:12px 14px}
.ci .h{display:flex;gap:9px;align-items:center;margin-bottom:8px}.ci .h .av{width:30px;height:30px;border-radius:8px;background:var(--tertiary-c);color:var(--on-tertiary-c);display:grid;place-items:center;flex:none}
.ci .h b{display:block}.ci .h small{display:block;color:var(--on-sv);font-size:11.5px}
.ci .h .ver{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);background:var(--sv);color:var(--on-sv);white-space:nowrap}
.ci .pl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.ci .pl label{display:inline-flex;gap:5px;align-items:center;font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:var(--r-full);background:var(--card)}
.ci .pl label input{accent-color:#22345C;margin:0}
.ci .st{display:flex;gap:12px;font-size:12px;color:var(--on-sv);flex-wrap:wrap}
.ci .st b{color:var(--on-surface)}
.ftype{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px}
.ft{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);padding:12px 14px;border-top:3px solid var(--fc)}
.ft b{display:block;font-size:13.5px}.ft small{display:block;color:var(--on-sv);font-size:12px;line-height:1.5;margin:4px 0 8px}
.ft .n{font-size:12px;color:var(--on-sv)}.ft .n b{display:inline;font-size:12px}

.rt{display:grid;gap:10px}.rt&gt;label{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);font-size:13px;cursor:pointer}
.rt&gt;label.on{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in oklab,var(--primary) 18%,transparent)}.rt b{display:block}.rt small{display:block;color:var(--on-sv);font-size:11.5px;line-height:1.6}
.cap{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,88px);gap:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;font-size:12.5px}

.css-sentinel{visibility:hidden;position:absolute}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;i class=&quot;css-sentinel&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;

v class=&quot;norole&quot; data-role=&quot;R2&quot; hidden&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect width=&quot;18&quot; height=&quot;11&quot; x=&quot;3&quot; y=&quot;11&quot; rx=&quot;2&quot; ry=&quot;2&quot;/&gt;&lt;path d=&quot;M7 11V7a5 5 0 0 1 10 0v4&quot;/&gt;&lt;/svg&gt;&lt;h3&gt;この画面は「代表と、その下に数人がいる会社の代表」には見えません&lt;/h3&gt;&lt;p&gt;中小・ベンチャーの社長。自分も現場を持ちつつ社員・外注に配っている&lt;br&gt;権限で主ナビの項目そのものが変わるため、この画面への入口がありません。&lt;/p&gt;&lt;div class=&quot;go&quot;&gt;この権限で見られるもの：今日、自分のAIと話す、AI社員の動き、自分のAIとAI社員のやりとり&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;norole&quot; data-role=&quot;R3&quot; hidden&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect width=&quot;18&quot; height=&quot;11&quot; x=&quot;3&quot; y=&quot;11&quot; rx=&quot;2&quot; ry=&quot;2&quot;/&gt;&lt;path d=&quot;M7 11V7a5 5 0 0 1 10 0v4&quot;/&gt;&lt;/svg&gt;&lt;h3&gt;この画面は「配られた仕事だけをする人」には見えません&lt;/h3&gt;&lt;p&gt;社員・外注。自分の担当分だけ見る。会社全体の数字も統制も見ない・見せない&lt;br&gt;権限で主ナビの項目そのものが変わるため、この画面への入口がありません。&lt;/p&gt;&lt;div class=&quot;go&quot;&gt;この権限で見られるもの：今日、自分のAIと話す、AI社員の動き、自分のAIとAI社員のやりとり&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;norole&quot; data-role=&quot;R4&quot; hidden&gt;&lt;svg class=&quot;&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect width=&quot;18&quot; height=&quot;11&quot; x=&quot;3&quot; y=&quot;11&quot; rx=&quot;2&quot; ry=&quot;2&quot;/&gt;&lt;path d=&quot;M7 11V7a5 5 0 0 1 10 0v4&quot;/&gt;&lt;/svg&gt;&lt;h3&gt;この画面は「進捗だけ見る外部の人」には見えません&lt;/h3&gt;&lt;p&gt;業務委託先・パートナー。書き込まない。見える範囲を絞って渡す&lt;br&gt;権限で主ナビの項目そのものが変わるため、
