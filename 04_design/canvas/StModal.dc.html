<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>引き継いでもらう・差し戻すの小窓</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;color:#131B27;background:#F2F4F7;font-size:13px;line-height:1.6}
a{color:#22345C}a:hover{color:#1A2848}
button,input,select,textarea{font-family:inherit}
input[type=text],select,textarea{border:1px solid #CBD2DC;border-radius:6px;background:#FFFFFF;padding:6px 10px;font-size:13px;color:#131B27;box-sizing:border-box;width:100%}
button{white-space:nowrap}


/* kn-shell: bars and panels run edge to edge; menu and side panel open/close */
[data-shell]{min-height:100vh !important;align-items:stretch}
[data-shell]>main{display:flex !important;flex-direction:column}
[data-shell]>main>header~*:last-child{flex:1 0 auto}
.kn-tgc{position:absolute;opacity:0;pointer-events:none}
.kn-tg:hover{background:#DDE2E9}
.kn-nav{transition:flex-basis .15s}
body:has(#kn-tg-nav:checked) .kn-nav{flex-basis:56px !important;padding:10px 6px !important}
body:has(#kn-tg-nav:checked) .kn-lbl{display:none !important}
body:has(#kn-tg-nav:checked) .kn-top{flex-direction:column;padding:4px 0 !important}
body:has(#kn-tg-nav:checked) .kn-tg{margin-left:0 !important}
body:has(#kn-tg-nav:checked) .kn-item{justify-content:center;padding:0 !important}
.kn-side{position:relative}
.kn-side>.kn-tg+*{padding-right:44px !important}
.kn-side>.kn-tg{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#4A5563;cursor:pointer;background:#FFFFFF}
.kn-reopen{display:none;flex:0 0 36px;background:#FFFFFF;border-left:1px solid #DDE2E9;justify-content:center;padding-top:10px;color:#4A5563;cursor:pointer}
.kn-reopen:hover{color:#22345C;background:#F7F8FA}
body:has(#kn-tg-side:checked) .kn-side{display:none !important}
body:has(#kn-tg-side:checked) .kn-reopen{display:flex}
@media (max-width:1023px){.kn-nav{flex-basis:56px !important;padding:10px 6px !important}.kn-lbl{display:none !important}.kn-top{flex-direction:column;padding:4px 0 !important}.kn-tg{margin-left:0 !important}.kn-item{justify-content:center;padding:0 !important}}
</style>
</helmet>
<div data-shell style="min-height: 100vh; position: relative; overflow: hidden; background: rgba(19,27,39,0.42)">
 <input type="checkbox" id="kn-tg-nav" class="kn-tgc" aria-label="メニューを閉じる"><input type="checkbox" id="kn-tg-side" class="kn-tgc" aria-label="パネルを閉じる">
 <div style="position: absolute; inset: 0; display: flex; gap: 24px; align-items: flex-start; justify-content: center; padding: 60px 24px; box-sizing: border-box">

  <section role="dialog" aria-label="引き継いでもらう" style="width: 460px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 24px 60px rgba(19,27,39,0.3); overflow: hidden">
   <div style="padding: 14px 18px; border-bottom: 1px solid #DDE2E9; display: flex; align-items: center"><b style="font-size: 15px">引き継いでもらう</b><button type="button" aria-label="閉じる" style="margin-left: auto; width: 28px; height: 28px; border: 0; background: transparent; color: #4A5563">×</button></div>
   <div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 12px; color: #4A5563">EG-119 問い合わせ（山田様）に一次返信する</div>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4A5563">渡す相手 <select><option>高本 聖斗（営業）</option></select></label>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4A5563">理由 <b style="color: #B91C1C; font-weight: 400">必須</b><textarea style="min-height: 52px">先方と面識があるので、高本さんから返したほうが早い</textarea></label>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4A5563">お願い<textarea style="min-height: 44px">今日中に一次返信だけお願いします</textarea></label>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4A5563">返事の期限<select><option>11/03（火）18:00</option></select></label>
    <fieldset style="border: 1px solid #DDE2E9; border-radius: 8px; padding: 8px 12px; margin: 0"><legend style="font-size: 12px; color: #4A5563; padding: 0 4px">一緒に切り替えるもの（会社の決まりで選ばれている）</legend>
     <label style="display: flex; gap: 6px; font-size: 12px"><input type="checkbox" checked>子チケット 2 件も渡す</label>
     <label style="display: flex; gap: 6px; font-size: 12px"><input type="checkbox" checked>分類「問い合わせ」はそのまま</label>
     <label style="display: flex; gap: 6px; font-size: 12px"><input type="checkbox">グループを「営業」から「営業（サポート）」に移す</label>
     <label style="display: flex; gap: 6px; font-size: 12px"><input type="checkbox">上の層（マネージャー）にも知らせる</label>
    </fieldset>
    <div style="font-size: 12px; color: #4A5563; background: #F7F8FA; border-radius: 6px; padding: 8px 10px">相手が受けるまで担当者はあなたのまま（状態：渡し中）。断られたら理由つきで戻ってきます。</div>
   </div>
   <div style="padding: 12px 18px; border-top: 1px solid #DDE2E9; display: flex; gap: 8px; justify-content: flex-end"><button type="button" style="height: 34px; border-radius: 6px; border: 1px solid #DDE2E9; background: #FFFFFF; padding: 0 14px; font-size: 13px; color: #131B27">やめる</button><button type="button" style="height: 34px; border-radius: 6px; border: 1px solid #22345C; background: #22345C; color: #FFFFFF; padding: 0 16px; font-size: 13px; font-weight: 500">渡す</button></div>
  </section>

  <section role="dialog" aria-label="差し戻す" style="width: 420px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 24px 60px rgba(19,27,39,0.3); overflow: hidden">
   <div style="padding: 14px 18px; border-bottom: 1px solid #DDE2E9; display: flex; align-items: center"><b style="font-size: 15px">差し戻す</b><button type="button" aria-label="閉じる" style="margin-left: auto; width: 28px; height: 28px; border: 0; background: transparent; color: #4A5563">×</button></div>
   <div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 12px; color: #4A5563">EG-128 セイコー様へ 11月分の請求書を送る</div>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4A5563">どこを直すか<select><option>成果物：請求書 No.2026-1101.pdf</option><option>本文：請求の内訳</option></select></label>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4A5563">理由 <b style="color: #B91C1C; font-weight: 400">必須</b><textarea style="min-height: 64px">10/19 の追加対応は無償なので外してください</textarea></label>
    <fieldset style="border: 1px solid #DDE2E9; border-radius: 8px; padding: 8px 12px; margin: 0"><legend style="font-size: 12px; color: #4A5563; padding: 0 4px">次は誰が直すか</legend>
     <label style="display: flex; gap: 6px; font-size: 12px"><input type="radio" name="who" checked>AI に直させて、確認からやり直す</label>
     <label style="display: flex; gap: 6px; font-size: 12px"><input type="radio" name="who">自分で直す</label>
    </fieldset>
    <label style="display: flex; gap: 6px; font-size: 12px"><input type="checkbox" checked>この理由を AI に覚えさせる候補にする（ナレッジ更新の候補）</label>
   </div>
   <div style="padding: 12px 18px; border-top: 1px solid #DDE2E9; display: flex; gap: 8px; justify-content: flex-end"><button type="button" style="height: 34px; border-radius: 6px; border: 1px solid #DDE2E9; background: #FFFFFF; padding: 0 14px; font-size: 13px; color: #131B27">やめる</button><button type="button" style="height: 34px; border-radius: 6px; border: 1px solid #22345C; background: #22345C; color: #FFFFFF; padding: 0 16px; font-size: 13px; font-weight: 500">差し戻す</button></div>
  </section>

  <section role="alertdialog" aria-label="取り消せない操作の確認" style="width: 380px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 24px 60px rgba(19,27,39,0.3); overflow: hidden">
   <div style="padding: 14px 18px; border-bottom: 1px solid #DDE2E9"><b style="font-size: 15px">承認して送ります</b></div>
   <div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
    <div style="border: 1px solid #F1C4C4; background: #FDECEC; border-radius: 8px; padding: 8px 10px; color: #991B1B"><b>メールの送信は取り消せません</b><div style="font-size: 12px">宛先：経理部 山田様（CC 鈴木様）・添付 1</div></div>
    <label style="display: flex; gap: 6px; font-size: 12px"><input type="checkbox" checked>③ 送る前に PDF を目で見た</label>
    <div style="font-size: 12px; color: #4A5563">大事な操作なので、もう一度本人確認をします（パスキー）</div>
   </div>
   <div style="padding: 12px 18px; border-top: 1px solid #DDE2E9; display: flex; gap: 8px; justify-content: flex-end"><button type="button" style="height: 34px; border-radius: 6px; border: 1px solid #DDE2E9; background: #FFFFFF; padding: 0 14px; font-size: 13px; color: #131B27">戻る</button><button type="button" style="height: 34px; border-radius: 6px; border: 1px solid #22345C; background: #22345C; color: #FFFFFF; padding: 0 16px; font-size: 13px; font-weight: 500">本人確認して送る</button></div>
  </section>
 </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
