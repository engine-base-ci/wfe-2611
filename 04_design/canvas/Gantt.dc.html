<html lang="ja">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;color:#131B27;background:#F2F4F7;font-size:13px;line-height:1.6}
a{color:#22345C}a:hover{color:#1A2848}
button,select{font-family:inherit}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1000px">
 <nav aria-label="メニュー" style="flex: 0 0 216px; background: #EEF0F4; border-right: 1px solid #DDE2E9; display: flex; flex-direction: column; gap: 1px; padding: 10px 8px; box-sizing: border-box">
  <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-weight: 700"><span style="width: 24px; height: 24px; border-radius: 6px; background: #22345C; color: #FFFFFF; display: grid; place-items: center; font-size: 12px">E</span>ENGINE BASE</div>
  <a href="Create.dc.html" style="margin: 6px 0; background: #22345C; color: #FFFFFF; border-radius: 6px; height: 34px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 500">＋ チケットを作る</a>
  <a href="Main.dc.html" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none">チケット</a>
  <a href="#" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none">承認待ち<b style="margin-left: auto; font-size: 11px; background: #B45309; color: #FFFFFF; border-radius: 99px; padding: 0 6px">2</b></a>
  <a href="#" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none">AI</a>
  <a href="#" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none">ナレッジ</a>
  <a href="#" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none">取引先</a>
  <div style="font-size: 12px; color: #4A5563; padding: 12px 10px 4px">グループ ★</div>
  <a href="Overview.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 6px; background: #22345C; color: #FFFFFF; text-decoration: none; font-weight: 500"><span style="width: 18px; height: 18px; border-radius: 4px; background: #FFFFFF; color: #186F69; font-size: 10px; display: grid; place-items: center">EG</span>営業</a>
  <a href="#" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none"><span style="width: 18px; height: 18px; border-radius: 4px; background: #6D4AA6; color: #FFFFFF; font-size: 10px; display: grid; place-items: center">JD</span>受託開発</a>
  <a href="#" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none"><span style="width: 18px; height: 18px; border-radius: 4px; background: #B45309; color: #FFFFFF; font-size: 10px; display: grid; place-items: center">KR</span>経理</a>
 </nav>

 <main style="flex: 999 1 640px; min-width: 0">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DDE2E9">
   <div style="display: flex; align-items: center; gap: 10px; padding: 12px 24px 0"><span style="width: 26px; height: 26px; border-radius: 6px; background: #186F69; color: #FFFFFF; font-size: 11px; display: grid; place-items: center; font-weight: 700">EG</span><h1 style="font-size: 18px; margin: 0">営業</h1></div>
   <nav aria-label="チケットの見え方" style="display: flex; gap: 2px; padding: 6px 24px 0; overflow-x: auto">
    <a href="Main.dc.html" style="padding: 8px 12px; border-bottom: 2px solid transparent; color: #4A5563; text-decoration: none; white-space: nowrap">自分に関わるもの</a>
    <a href="Overview.dc.html" style="padding: 8px 12px; border-bottom: 2px solid transparent; color: #4A5563; text-decoration: none">概要</a>
    <a href="List.dc.html" style="padding: 8px 12px; border-bottom: 2px solid transparent; color: #4A5563; text-decoration: none">一覧</a>
    <a href="Calendar.dc.html" style="padding: 8px 12px; border-bottom: 2px solid transparent; color: #4A5563; text-decoration: none">カレンダー</a>
    <a href="Gantt.dc.html" aria-current="page" style="padding: 8px 12px; border-bottom: 2px solid #22345C; color: #22345C; font-weight: 500; text-decoration: none">ガント</a>
   </nav>
  </header>
  <div style="padding: 16px 24px">
   <section style="background: #FFFFFF; border: 1px solid #DDE2E9; border-radius: 8px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #DDE2E9; flex-wrap: wrap; font-size: 12px; color: #4A5563">
     <button type="button" style="height: 28px; border: 1px solid #DDE2E9; border-radius: 6px; background: #FFFFFF; padding: 0 10px; font-size: 12px; color: #131B27">今日</button>
     <button type="button" aria-label="前へ" style="width: 28px; height: 28px; border: 1px solid #DDE2E9; border-radius: 6px; background: #FFFFFF; color: #131B27">‹</button><button type="button" aria-label="次へ" style="width: 28px; height: 28px; border: 1px solid #DDE2E9; border-radius: 6px; background: #FFFFFF; color: #131B27">›</button>
     <span style="display: inline-flex; border: 1px solid #DDE2E9; border-radius: 6px; overflow: hidden"><button type="button" style="height: 26px; border: 0; background: #22345C; color: #FFFFFF; padding: 0 10px; font-size: 12px">日</button><button type="button" style="height: 26px; border: 0; background: #FFFFFF; color: #4A5563; padding: 0 10px; font-size: 12px">週</button><button type="button" style="height: 26px; border: 0; background: #FFFFFF; color: #4A5563; padding: 0 10px; font-size: 12px">月</button></span>
     まとめ方<select style="height: 28px; border: 1px solid #DDE2E9; border-radius: 6px; font-size: 12px"><option>親子</option><option>責任者</option><option>節目</option></select>
     責任者<select style="height: 28px; border: 1px solid #DDE2E9; border-radius: 6px; font-size: 12px"><option>すべて</option></select>
     <span style="margin-left: auto; display: flex; gap: 6px"><button type="button" style="height: 28px; border: 1px solid #F3D3A7; border-radius: 6px; background: #FCEBD5; padding: 0 10px; font-size: 12px; color: #7A4A05">開始・期限が無い 4 件</button><button type="button" style="height: 28px; border: 1px solid #DDE2E9; border-radius: 6px; background: #FFFFFF; padding: 0 10px; font-size: 12px; color: #131B27">表示設定</button></span>
    </div>
    <div style="display: flex; border-bottom: 1px solid #DDE2E9; background: #FAFBFC; font-size: 11px; color: #4A5563">
     <div style="flex: 0 0 380px; display: grid; grid-template-columns: 1fr 64px 72px; padding: 0 10px; align-items: end; border-right: 1px solid #DDE2E9"><span style="padding: 6px 0">件名</span><span>責任者</span><span>状態</span></div>
     <div style="flex: 1; min-width: 0; position: relative">
      <div style="display: flex; height: 22px; border-bottom: 1px solid #EDF0F4"><span style="flex: 6; padding-left: 4px">10月</span><span style="flex: 30; padding-left: 4px; border-left: 1px solid #DDE2E9">2026年11月</span></div>
      <div style="display: flex; height: 22px">
       <sc-for list="{{days}}" as="d" hint-placeholder-count="36"><span style="{{d.style}}">{{d.n}}</span></sc-for>
      </div>
      <sc-for list="{{flags}}" as="f" hint-placeholder-count="3"><span style="{{f.style}}">⚑ {{f.name}}</span></sc-for>
     </div>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
     <div style="display: flex; border-bottom: 1px solid #EDF0F4; height: 34px">
      <div style="flex: 0 0 380px; display: grid; grid-template-columns: 1fr 64px 72px; padding: 0 10px; align-items: center; border-right: 1px solid #DDE2E9; min-width: 0">
       <a href="TicketDetail.dc.html" style="{{r.titleStyle}}">{{r.title}}</a>
       <span style="font-size: 12px">{{r.owner}}</span>
       <span style="{{r.stStyle}}">{{r.state}}</span>
      </div>
      <div style="flex: 1; min-width: 0; position: relative; background-image: linear-gradient(to right, #F2F4F7 1px, transparent 1px); background-size: 2.7778% 100%">
       <span style="position: absolute; top: 0; bottom: 0; left: 19.44%; width: 2px; background: #B91C1C"></span>
       <span style="{{r.bar}}">{{r.barText}}</span>
      </div>
     </div>
    </sc-for>
   </section>
  </div>
 </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var N = 36; // 10/26〜11/30
    var pos = function (m, d) { return (m === 10 ? d - 26 : d + 5); };
    var days = [];
    for (var i = 0; i < N; i++) {
      var d = i < 6 ? 26 + i : i - 5, dow = (i + 1) % 7; // 10/26 は月曜
      var we = (i % 7 === 5 || i % 7 === 6);
      days.push({ n: d, style: "flex:1;text-align:center;line-height:22px;" + (we ? "background:#F2F4F7;" : "") + (i === 7 ? "color:#FFFFFF;background:#B91C1C;border-radius:4px;" : "") });
    }
    var S = { "承認待ち": "#B45309", "実行中": "#1D4ED8", "確認中": "#6D4AA6", "作業中": "#2F4B7C", "未着手": "#6B7585", "完了": "#166534", "保留": "#374151" };
    var row = function (t, owner, st, sm, sd, em, ed, lvl, parent, late) {
      var a = pos(sm, sd), b = pos(em, ed) + 1;
      var col = parent ? "#22345C" : S[st];
      return { title: t, owner: owner, state: st,
        titleStyle: "overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-decoration:none;color:#131B27;padding-left:" + (lvl * 16) + "px;" + (parent ? "font-weight:500;" : ""),
        stStyle: "font-size:11px;color:#FFFFFF;border-radius:99px;padding:0 6px;text-align:center;background:" + S[st],
        bar: "position:absolute;top:" + (parent ? "11px" : "8px") + ";height:" + (parent ? "12px" : "18px") + ";left:" + (a / N * 100).toFixed(2) + "%;width:" + ((b - a) / N * 100).toFixed(2) + "%;background:" + col + ";opacity:" + (st === "完了" ? "0.55" : "1") + ";border-radius:" + (parent ? "2px" : "4px") + ";color:#FFFFFF;font-size:11px;line-height:18px;padding-left:6px;box-sizing:border-box;overflow:hidden;white-space:nowrap;" + (late ? "outline:2px solid #B91C1C;outline-offset:1px;" : ""),
        barText: parent ? "" : t.split(" ")[0] };
    };
    return {
      days: days,
      flags: [ { name: "保守更新", style: "position:absolute;top:0;left:" + (pos(11, 15) / N * 100).toFixed(2) + "%;font-size:11px;color:#B45309;white-space:nowrap" },
               { name: "11月 締め", style: "position:absolute;top:0;left:" + (pos(11, 30) / N * 100 - 6).toFixed(2) + "%;font-size:11px;color:#B45309;white-space:nowrap" } ],
      rows: [
        row("【親】セイコー様 保守契約の更新", "高本", "作業中", 10, 26, 11, 15, 0, true),
        row("EG-125 更新の条件をすり合わせる", "鈴木", "完了", 10, 26, 10, 28, 1),
        row("EG-126 更新の見積を作る", "鈴木", "確認中", 10, 29, 11, 5, 1),
        row("EG-129 契約書の更新版を送る", "鈴木", "未着手", 11, 6, 11, 12, 1),
        row("EG-130 更新の最終確認（定例）", "高本", "未着手", 11, 14, 11, 14, 1),
        row("【親】11月 月次の締め", "高本", "作業中", 10, 30, 11, 30, 0, true),
        row("EG-128 11月分の請求書を送る", "高本", "承認待ち", 10, 30, 11, 1, 1, false, true),
        row("EG-131 月次レポートを送る", "高本", "未着手", 11, 9, 11, 10, 1),
        row("EG-145 11月の締め", "高本", "未着手", 11, 26, 11, 30, 1),
        row("EG-127 発注ナビ 応募文を出す", "高本", "実行中", 11, 2, 11, 2, 0),
        row("EG-118 応募結果をまとめる", "田中", "保留", 10, 26, 10, 31, 0, false, true),
        row("EG-119 一次返信する", "佐藤", "作業中", 11, 1, 11, 5, 0)
      ]
    };
  }
}
</script>
</body>
</html>
