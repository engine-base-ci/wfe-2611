<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ルール</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;color:#131B27;background:#F2F4F7;font-size:13px;line-height:1.6}
a{color:#22345C}a:hover{color:#1A2848}
button,input,select{font-family:inherit}
th,button{white-space:nowrap}
span[style*="border-radius: 99px"],b[style*="border-radius: 99px"]{white-space:nowrap}
th{font-size:12px;color:#4A5563;font-weight:500;text-align:left;padding:0 8px;height:32px;border-bottom:1px solid #DDE2E9;background:#FAFBFC}
td{height:44px;padding:4px 8px;border-bottom:1px solid #EDF0F4}
td:nth-child(n+2){white-space:nowrap}
input[type=text],select{height:32px;border:1px solid #CBD2DC;border-radius:6px;background:#FFFFFF;padding:0 10px;font-size:13px;color:#131B27;box-sizing:border-box}
@media (max-width:1023px){nav[aria-label="メニュー"]{flex-basis:56px !important;font-size:0 !important;padding:10px 6px !important}nav[aria-label="メニュー"] a,nav[aria-label="メニュー"] div{justify-content:center !important;padding-left:0 !important;padding-right:0 !important}nav[aria-label="メニュー"] b{display:none}}
@media (max-width:767px){nav[aria-label="メニュー"]{display:none !important}header label{width:auto !important;flex:1 1 120px;min-width:0}header>div{flex-wrap:wrap}form{flex-wrap:wrap}}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1000px">
 <nav aria-label="メニュー" style="flex: 0 0 216px; background: #EEF0F4; border-right: 1px solid #DDE2E9; display: flex; flex-direction: column; gap: 1px; padding: 10px 8px; box-sizing: border-box">
  <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-weight: 700"><span style="width: 24px; height: 24px; border-radius: 6px; background: #22345C; color: #FFFFFF; display: grid; place-items: center; font-size: 12px">E</span>ENGINE BASE<span style="margin-left: auto; color: #4A5563">▾</span></div>
  <a href="Create.dc.html" style="margin: 6px 0; background: #22345C; color: #FFFFFF; border-radius: 6px; height: 34px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 500">＋ チケットを作る</a>
  <a href="Main.dc.html" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none">チケット</a>
  <a href="Approvals.dc.html" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none">承認待ち<b style="margin-left: auto; font-size: 11px; background: #B45309; color: #FFFFFF; border-radius: 99px; padding: 0 6px">7</b></a>
  <a href="AiChat.dc.html" aria-current="page" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; background: #22345C; color: #FFFFFF; text-decoration: none; font-weight: 500">AI</a>
  <a href="#" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none">ナレッジ</a>
  <a href="#" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; color: #131B27; text-decoration: none">取引先</a>
 </nav>
 <main style="flex: 999 1 640px; min-width: 0">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DDE2E9">
   <div style="display: flex; align-items: center; gap: 10px; padding: 12px 24px 0; flex-wrap: wrap">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#131B27" stroke-width="2" aria-hidden="true"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2M20 14h2M15 13v2M9 13v2"></path></svg>
    <h1 style="font-size: 18px; margin: 0">高本のAI</h1>
    <span style="margin-left: auto; display: flex; gap: 6px; align-items: center">
     <label style="display: flex; align-items: center; gap: 6px; height: 32px; width: 260px; border: 1px solid #DDE2E9; border-radius: 99px; padding: 0 12px; background: #F7F8FA; color: #4A5563"><span style="position: absolute; left: -9999px">探す</span><input type="search" placeholder="探す" style="border: 0; background: transparent; flex: 1; font-size: 12px; min-width: 0"></label>
     <button type="button" aria-label="知らせ" style="width: 36px; height: 36px; border: 0; border-radius: 99px; background: transparent; color: #131B27"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path></svg></button>
     <span style="width: 28px; height: 28px; border-radius: 99px; background: #6B5B99; color: #FFFFFF; display: grid; place-items: center; font-size: 12px">高</span>
    </span>
   </div>
   <nav aria-label="AI のタブ" style="display: flex; gap: 2px; padding: 6px 24px 0">
    <a href="AiChat.dc.html" style="padding: 8px 12px; border-bottom: 2px solid transparent; color: #4A5563; text-decoration: none">会話</a>
    <a href="AiActivity.dc.html" style="padding: 8px 12px; border-bottom: 2px solid transparent; color: #4A5563; text-decoration: none">AI の動き</a>
    <a href="AiWorkTypes.dc.html" style="padding: 8px 12px; border-bottom: 2px solid transparent; color: #4A5563; text-decoration: none">業務の型</a>
    <a href="AiRules.dc.html" aria-current="page" style="padding: 8px 12px; border-bottom: 2px solid #22345C; color: #22345C; font-weight: 500; text-decoration: none">ルール</a>
   </nav>
  </header>
  <div style="padding: 16px 24px; display: flex; flex-direction: column; gap: 12px">
   <div style="font-size: 12px; color: #4A5563">ルールは自分の AI が仕事をするときに必ず守ること。業務の型の上に重ねて効く。効く順は 取引先 → 自分 → 層 → 会社（近いものが先）</div>
   <section style="background: #FFFFFF; border: 1px solid #DDE2E9; border-radius: 8px">
    <div style="display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid #DDE2E9; flex-wrap: wrap">
     <span style="display: flex; gap: 6px; flex-wrap: wrap"><button type="button" style="height: 26px; border: 1px solid #22345C; background: #22345C; color: #FFFFFF; border-radius: 99px; padding: 0 10px; font-size: 12px">すべて 14</button><button type="button" style="height: 26px; border: 1px solid #DDE2E9; background: #FFFFFF; color: #4A5563; border-radius: 99px; padding: 0 10px; font-size: 12px">会社 5</button><button type="button" style="height: 26px; border: 1px solid #DDE2E9; background: #FFFFFF; color: #4A5563; border-radius: 99px; padding: 0 10px; font-size: 12px">層・グループ 3</button><button type="button" style="height: 26px; border: 1px solid #DDE2E9; background: #FFFFFF; color: #4A5563; border-radius: 99px; padding: 0 10px; font-size: 12px">自分 2</button><button type="button" style="height: 26px; border: 1px solid #DDE2E9; background: #FFFFFF; color: #4A5563; border-radius: 99px; padding: 0 10px; font-size: 12px">取引先 4</button></span>
     <span style="margin-left: auto; font-size: 12px; color: #4A5563">会社のルールを直せるのは会社の管理者、層はその層のマネージャー、自分は本人</span>
    </div>
    <form style="display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid #DDE2E9; background: #FAFBFC">
     <label style="flex: 1 1 360px; min-width: 0"><span style="position: absolute; left: -9999px">ルール</span><input type="text" placeholder="ルールを書く（例：見積の有効期限は 30 日と書く）" style="width: 100%"></label>
     <label><span style="position: absolute; left: -9999px">効く範囲</span><select><option>自分</option><option>層：営業</option><option>会社</option><option>取引先：…</option></select></label>
     <label><span style="position: absolute; left: -9999px">対象</span><select><option>すべての仕事</option><option>業務の型：請求書を作る</option></select></label>
     <button type="button" style="height: 32px; border-radius: 6px; border: 1px solid #22345C; background: #22345C; color: #FFFFFF; padding: 0 14px; font-size: 13px; font-weight: 500">足す</button>
    </form>
    <div style="overflow-x: auto">
     <table style="border-collapse: collapse; width: 100%">
      <thead><tr><th>ルール</th><th>効く範囲</th><th>対象</th><th>作った人</th><th>最終更新</th><th>効いた回数（30 日）</th><th></th></tr></thead>
      <tbody>
       <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
        <tr><td>{{r.text}}<sc-if value="{{r.from}}" hint-placeholder-val="{{ false }}"><span style="display: block; font-size: 11px; color: #4A5563">元：{{r.from}}</span></sc-if></td><td><span style="{{r.scopeStyle}}">{{r.scope}}</span></td><td style="font-size: 12px; color: #4A5563">{{r.target}}</td><td style="font-size: 12px">{{r.by}}</td><td style="font-size: 12px; color: #4A5563">{{r.upd}}</td><td style="font-size: 12px">{{r.n}}</td><td><button type="button" style="height: 26px; border-radius: 6px; border: 1px solid #DDE2E9; background: #FFFFFF; padding: 0 8px; font-size: 12px; color: #131B27">直す</button></td></tr>
       </sc-for>
      </tbody>
     </table>
    </div>
   </section>
  </div>
 </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { "会社": "#186F69", "層：営業": "#6D4AA6", "層：受託開発": "#6D4AA6", "自分": "#7E570D", "取引先：セイコー": "#2F4B7C", "取引先：京蟻": "#2F4B7C" };
    var r = function (text, scope, target, by, upd, n, from) { return { text: text, scope: scope, scopeStyle: "font-size:11px;color:#FFFFFF;border-radius:99px;padding:1px 8px;background:" + C[scope], target: target, by: by, upd: upd, n: n, from: from || "" }; };
    return { rows: [
      r("宛名は経理部 山田様、CC に営業の鈴木様を入れる", "取引先：セイコー", "すべての仕事", "高本", "10/28", "3", "山田様のメール 10/28（EG-128）"),
      r("見積は税込と税抜を両方書く", "取引先：京蟻", "業務の型：見積を作る", "佐藤", "10/15", "4"),
      r("請求は 25 日締め・翌月末払い", "会社", "業務の型：請求書を作る", "高本", "09/30", "9"),
      r("外に出すメールの署名は会社の署名（設定の値「署名」）", "会社", "すべての仕事", "高本", "09/30", "22"),
      r("値引きは決定ログに無ければ書かない", "会社", "請求・見積", "高本", "10/02", "11", "差し戻しの理由から（EG-104）"),
      r("応募文は 400 字以内・実績は 3 件まで", "層：営業", "業務の型：応募文", "高本", "10/20", "14"),
      r("工数は過去の似た案件の実績を引用する", "層：受託開発", "業務の型：見積を作る", "佐藤", "10/18", "6"),
      r("返事は です・ます、絵文字は使わない", "自分", "すべての仕事", "高本", "09/12", "31"),
      r("午前中に送るメールは前日の夕方に下書きで止める", "自分", "メールを送る", "高本", "10/01", "5")
    ] };
  }
}
</script>
</body>
</html>
