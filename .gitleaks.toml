# 秘密の検査（gitleaks 8.30）の設定。既定の規則をそのまま使い、試験の作り物の値の置き場 4 つの道だけを外す（K-328・Bridge と通しの試験の 2 つは K-350）。
# 外すのは道だけ。値の正規表現や止め語では外さない（ほかの道に同じ形の本物が来ても見つける）。
# 例外：契約の型の 4 ファイル（packages/contracts/src の ops・registry・schemas・types）の openapi.yaml の要約（16 けたの 16 進）だけは、道と値の両方がそろうときに外す（下の規則 generic-api-key の allowlists・K-362・answer=2fd73e54782f）。
# 試験に作り物の秘密を書くときは apps/{api,web,bridge}/test/_fake/secrets.ts・apps/e2e/_fake/secrets.ts に足して import する（.gitleaksignore は使わない）。
title = "Kaname の秘密の検査"

[extend]
useDefault = true

[[allowlists]]
description = "試験の作り物の値の置き場（本物の秘密ではない）"
paths = ['''^apps/api/test/_fake/''', '''^apps/web/test/_fake/''', '''^apps/bridge/test/_fake/''', '''^apps/e2e/_fake/''']

# 例外の中身：既定の規則 generic-api-key に、道と値の両方がそろうときだけ外す項目を足す（全体の [[allowlists]] は道だけで外してしまい AND が効かないので、規則の中に置く）。
#   同じ 4 ファイルでも、本物の鍵の形（sk- で始まる値・32 けた以上の値）は今までどおり当たる（K-362 で手元の gitleaks 8.30.1 で確かめた）
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "契約の生成物 4 ファイルが持つ openapi.yaml の中身の要約（16 けたの 16 進・秘密ではない）。道と値の両方がそろうときだけ外す（K-362・answer=2fd73e54782f）"
condition = "AND"
paths = ['''^packages/contracts/src/(ops|registry|schemas|types)\.ts$''']
regexes = ['''^(openapi:)?[0-9a-f]{16}$''']
