# ticket-flow の設定（~/.claude/skills/ticket-flow・2026-11-12）
mainline: claude/modest-lamport-77ue02
remote: origin
remote_mainline: main
wip: 3
tickets:
  dir: 11_tickets
  file: "{id}.md"
  row_pattern: '{nodash}-[A-Z0-9]+-\d+'
  fields: { tests: tests, changes: changes, depends_on: depends_on }
tests_pattern: '(^|/)(tests?|__tests__)/|\.(test|spec)\.(m|c)?(ts|tsx|js|jsx)$|(^|/)test_[^/]+\.py$|_test\.py$'
ci:
  workflow: v3-gate.yml
  artifact: junit
  timeout_min: 30
  inputs: { scope: scope, ticket: ticket, base: base }
notices:
  write:
    [
      "npx prettier --check --ignore-unknown {changed}",
      "python3 ~/.claude/skills/test-verification/scripts/pattern_gate.py 11_tickets/*.md --local 07_qa/test-patterns.local.json",
    ]
  build: ["npx prettier --check --ignore-unknown {changed}", "npx eslint --no-warn-ignored {changed}"]
answers: 01_hearing/decider-answers.jsonl
# GitHub に出す前に：依存を入れ、CI の定義（v3-gate.yml）の static・spec の組をそのまま手元で流す（まっさらな写しで・K-178）
# 手で選んだ検査の一覧は持たない（CI だけが流す検査が漏れ、出してから赤で戻った・K-161）
preflight: ["pnpm install --frozen-lockfile --prefer-offline --silent"]
preflight_jobs: [static, spec]
# 重さ：1 本が触ってよい重い組は 1 つ（画面と DB を 1 本で触ると CI 1 回が 17 分・K-161）
weight:
  groups: { web: ["apps/web/**"], db: ["packages/db/**"] }
  max: 1
# changes: に書かなくてよい物：作り手が作り直す生成物（scripts/ci/generated.json の outputs）と決める人の答えの記録
changes_ignore:
  - ".github/workflows/release-gate.yml"
  - ".github/workflows/v3-gate.yml"
  - "01_hearing/decider-answers.jsonl"
  - "01_hearing/要件一覧.md"
  - "03_architecture/catalog.json"
  - "03_architecture/catalog.md"
  - "03_architecture/flow-lines.json"
  - "05_flow/使ってもらい方.md"
  - "07_functional/*"
  - "07_qa/test-plan/*"
  - "07_qa/test-specs/errors.md"
  - "08_api/API-SPEC.md"
  - "08_api/api-decisions.json"
  - "08_api/api-spec.html"
  - "08_api/endpoints.json"
  - "08_api/openapi.yaml"
  - "08_api/screen-api-coverage.json"
  - "08_api/types.ts"
  - "11_tickets/README.md"
  - "11_tickets/tickets.csv"
  - "11_tickets/tickets.json"
  - "apps/api/src/routes/*"
  - "apps/api/test/generated/*"
  - "apps/bridge/src/renderer/tokens.css"
  - "apps/web/lib/built-routes.ts"
  - "apps/web/lib/nav.ts"
  - "apps/web/lib/routes.ts"
  - "apps/web/styles/k-tokens.css"
  - "packages/contracts/src/*"
  - "packages/errors/src/catalog.ts"
# 切る段（大分類ごとにまとめて切った枝）から、1 本の分だけを持ち込む台本（K-187）
cut:
  take: "python3 scripts/tickets/cut_take.py {ticket} {ref}"
# CI の台：組ごとに使い捨ての Linux の VM（~/.claude/skills/ticket-flow/scripts/vm.py・K-173 の実測で 3 台×3 コア）
vm:
  label: linux-vm
  image: tf-golden
  base: ghcr.io/cirruslabs/ubuntu:latest
  slots: 3
  cpu: 3
  memory: 4096
  account: engine-base
  tools: { python: ["3.14"], node: ["22"] }
  warm:
    [
      "npm i -g pnpm@10 --prefix ~/.local",
      "pnpm install --frozen-lockfile",
      "bash scripts/ci/ci_venv.sh",
      "pnpm --filter @kaname/web exec playwright install --with-deps chromium",
    ]
